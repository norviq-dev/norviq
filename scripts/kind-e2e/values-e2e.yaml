# Settings that make a cluster a TEST RIG rather than a deployment.
#
# WHY THIS FILE EXISTS. There are two install paths for the browser suite — scripts/kind-e2e/00-up.sh
# for a laptop and the `Install the chart` step in .github/workflows/kind-e2e.yml for CI — and they
# drifted twice in one day, both times silently and both times costing a full run:
#
#   * The NodePort. e2e-cluster.yaml maps host 3400 -> node:30080 and says "patched to NodePort after
#     install"; only 00-up.sh patched it. CI got the mapping and no Service, so every request was
#     accepted and reset — 27 ERR_CONNECTION_RESET in one shard.
#   * This rate-limit ceiling. Set in 00-up.sh:125 and nowhere else, so CI kept running into the
#     production default.
#
# A fix that lands in one path reads as applied and applies to half the runs. Anything both paths
# need belongs here, in one file, passed with `-f` by both. tests/test_e2e_harness_parity.py fails if
# either path stops using it.
#
# NOT a customer-facing values file, which is why it lives under scripts/ and not in helm/norviq/ —
# `helm package` sweeps up every values-*.yaml in the chart directory, and a test rig's ceilings have
# no business shipping to an operator.

images:
  # The rig BUILDS `norviq/norviq-engine:*` from the working tree and kind-loads it; this is what makes
  # the cluster run that build. It lived only in 00-up.sh's --set flags, so CI's install kept the chart
  # default `ghcr.io/norviq-dev/` and every kind-e2e run tested the PUBLISHED `-latest` images instead
  # of the pull request's code (measured by rendering both installs: CI's produced
  # ghcr.io/norviq-dev/norviq-engine:*-latest for all five). The third drift this file exists to stop.
  #
  # IfNotPresent on all five: values-dev sets Always, and Always defeats `kind load` entirely — the node
  # goes to a registry and never sees the image just loaded. For `norviq/` that registry is Docker Hub's
  # `norviq` namespace, which this project does not own, so Always would also pull a stranger's image.
  registry: "norviq/"
  api: {pullPolicy: IfNotPresent}
  ui: {pullPolicy: IfNotPresent}
  engine: {pullPolicy: IfNotPresent}
  webhook: {pullPolicy: IfNotPresent}
  bootstrap: {pullPolicy: IfNotPresent}

webhook:
  # The rig builds `norviq/norviq-engine:*` and kind-loads it. Without this the webhook refuses that
  # name, falls back to the published GHCR sidecar (NRVQ-WHK-4062), and injection tests the wrong image.
  allowLocalSidecarImages: true

config:
  extraEnv:
    # The suite drives ~190 specs through ONE admin identity and the limiter keys on the JWT `sub`,
    # so all of them share a single bucket: 300-480 requests per 60s window against a 300 default.
    # The 429s then land on whichever spec happens to be running, which is why the failing SET moved
    # between runs while the count stayed flat — it reads like flakiness and is arithmetic.
    #
    # Sharding made it worse, not better. Four jobs do not share a bucket (each has its own cluster,
    # API and Redis), but each shard now packs ~49 specs into ~2.3 minutes instead of spreading 190
    # over 25, so the requests-per-window went UP.
    #
    # No real operator generates this load: 300/60s is 20-60 console page-loads a minute sustained.
    # The ceiling is right for production and wrong for a test rig, so it is raised HERE and the
    # product default stays 300. The limiter keeps its own unit coverage in tests/api/test_rate_limit.py
    # (which drives it at a ceiling of 1 or 2), so raising it for the browser suite removes no
    # coverage of the control itself.
    NRVQ_HTTP_RATE_LIMIT_DEFAULT_PER_WINDOW: "5000"
