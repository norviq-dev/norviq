[project]
name = "norviq"
version = "0.1.10"
description = "Runtime policy enforcement for LLM agent tool calls on Kubernetes."
# PyPI-specific long description: pypi.org cannot resolve README.md's relative links/images, and the
# pypi.org audience wants the Python SDK rather than README.md's `git clone` + `helm install` opener.
readme = "PYPI-README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Norviq" }]
keywords = ["llm", "agents", "security", "policy-enforcement", "opa", "kubernetes", "ai-safety"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    # SECURITY FLOOR, declared directly even though nothing here imports it as a first-class
    # dependency. cryptography arrives transitively via pyjwt / spiffe / azure-identity / pyopenssl,
    # and its PyPI wheels STATICALLY LINK OpenSSL: every wheel below 48.0.1 bundles the OpenSSL
    # vulnerable to GHSA-537c-gmf6-5ccf (HIGH, CVSS 7.5 — openssl-library.org/news/secadv/20260609).
    #
    # It has to live HERE, not only in [tool.uv] constraint-dependencies, because the shipped images
    # install with PIP (`pip install '.[spiffe]'` in Dockerfile.api / Dockerfile.engine) and pip reads
    # neither uv.lock nor uv's constraints. Without this line the image happens to get a fixed version
    # only because spiffe>=0.3 requires cryptography>=46 and pip picks the newest match — incidental,
    # not guaranteed, and it silently regresses the day any transitive cap pins it back.
    "cryptography>=48.0.1",
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=23.0",
    "httpx>=0.24",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "opentelemetry-exporter-prometheus>=0.41b0",
    "prometheus-client>=0.20",
    # The [hiredis] extra is a LATENCY dependency, not a nicety. redis-py falls back to a pure-Python
    # RESP parser when hiredis is absent, and the cost of that parser scales with the number of values
    # returned — invisible on the small GETs that dominate a test suite, decisive on the one hot-path
    # query that returns 500. Measured in-cluster on the trust history read (ZRANGEBYSCORE, 500 rows):
    # p50 9.28ms -> 0.44ms and p90 53.9ms -> 1.55ms, a 21x/35x improvement from this extra alone.
    # Redis itself was never the problem: its own commandstats put the same query at 190us server-side,
    # so ~98% of what the caller waited for was client-side parsing. redis-py selects the C parser
    # automatically when it can import hiredis, so this needs no code change.
    "redis[hiredis]>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "networkx>=3.0",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "websockets>=12",
    "pyjwt[crypto]>=2.8",
    # bcrypt DIRECTLY, not `passlib[bcrypt]`. `norviq/api/passwords.py` imports bcrypt and says in its
    # own docstring that passlib is deliberately not used — its CryptContext is broken against bcrypt
    # 5.x, which is the version resolved here. So passlib was installed into every shipped image and
    # never imported, while the module that IS imported was only reachable as somebody else's extra:
    # a `passlib` release that dropped the extra would have broken login at import time.
    # Only hashpw/gensalt/checkpw are used — stable across 4.x and 5.x.
    "bcrypt>=4.1",
]

[project.scripts]
norviq = "norviq.cli.main:main"

[project.urls]
Homepage = "https://norviq.dev"
Documentation = "https://docs.norviq.dev"
Repository = "https://github.com/norviq-dev/norviq"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx", "ruff>=0.2"]
# Real SPIFFE workload identity (NRVQ_SPIFFE_MODE=workload-api). Optional + import-guarded so mock
# mode (default) and CI/attack venvs install lean; only real SPIRE deployments need it.
spiffe = ["spiffe>=0.3"]
# SDK framework adapters (norviq/sdk/**). Each is import-guarded — the adapter module only
# imports its framework lazily inside a loader function — so installing norviq alone never pulls
# any of these in; pick the extra(s) matching the agent framework(s) you actually use.
langchain = ["langchain-core>=0.2"]
langgraph = ["langgraph>=0.2"]
# `mcp` is crewai's own dependency (crewai requires mcp>=1.16.0, uncapped). The floor is
# declared HERE, in the extra, and not only in [tool.uv] constraint-dependencies, because
# `pip install '.[crewai]'` reads neither uv.lock nor uv's constraints. 1.28.1 fixes
# CVE-2026-59950 (WebSocket server transport accepts any Host/Origin). Capped below the 2.0
# major, which crewai does not yet declare support for. See SECURITY.md.
crewai = ["crewai>=0.80", "mcp>=1.28.1,<2"]
autogen = ["autogen-core>=0.4", "autogen-agentchat>=0.4", "autogen-ext[openai]>=0.4"]
# MCP action-firewall (norviq/mcp). The PROXY itself needs nothing beyond the base dependencies —
# it speaks JSON-RPC over pipes and reuses the SDK's httpx engine client, deliberately taking no
# dependency on the `mcp` SDK so it can forward messages it does not model (see norviq/mcp/protocol.py).
# This extra exists for the streamable-HTTP driver (starlette) and for the adversarial harness, which
# drives a REAL `mcp` client so the end-to-end claim is not tested against a bespoke one. Same
# CVE-2026-59950 floor as the crewai extra.
mcp = ["mcp>=1.28.1,<2", "starlette>=0.37"]
semantic-kernel = ["semantic-kernel>=1.0"]
frameworks = [
    "langchain-core>=0.2",
    "langgraph>=0.2",
    "crewai>=0.80",
    "mcp>=1.28.1,<2",  # CVE-2026-59950 — see the crewai extra above
    "autogen-core>=0.4",
    "autogen-agentchat>=0.4",
    "autogen-ext[openai]>=0.4",
    "semantic-kernel>=1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Security floor for a transitive dependency. werkzeug is pulled only by the optional
# semantic-kernel framework extra (via openapi-core) — never by the shipped `.[spiffe]` runtime image.
# 3.1.6 fixes CVE-2025-66221 / CVE-2026-21860 / CVE-2026-27199 (Windows safe_join device-name
# path-traversal / DoS in send_from_directory); resolves to the latest 3.1.x (3.1.8). See SECURITY.md.
constraint-dependencies = ["werkzeug>=3.1.6"]

# Lock only for the interpreters this project actually claims (see `classifiers`: 3.11, 3.12 —
# both images are python:3.12-slim and CI runs 3.12). Without this, `requires-python = ">=3.11"`
# has no ceiling, so uv also resolves a python 3.14 FORK of the optional framework extras. No one
# builds or tests that fork, and because upstreams do not support 3.14 yet the resolver walks them
# BACKWARDS to find something installable there — pinning instructor 1.12 and semantic-kernel 1.8,
# and dragging in `diskcache` (CVE-2025-69872, no fixed release) purely as an artifact of it.
# The dependency-vulnerability gate then scores us on packages that ship nowhere. Widen this the
# day 3.13/3.14 are supported for real — tested and in `classifiers` — not before.
environments = ["python_version < '3.14'"]

# spiffe and the agent-framework extras CANNOT co-resolve, and that is a property of their upstreams
# rather than a choice: spiffe>=0.3 requires protobuf>=6.31.1,<8, while every autogen-core>=0.4
# requires protobuf 4.x or 5.x. Declaring the conflict lets uv resolve each extra in its own fork
# instead of failing the whole lock, which is what unblocked the cryptography security floor above —
# the old lock was pinned to spiffe 0.2.x, and spiffe 0.2.x caps cryptography<47.
#
# Nothing installs both: the shipped images take `.[spiffe]` (Dockerfile.api / Dockerfile.engine) and
# framework-compat.yml installs one framework at a time in a matrix. `.[frameworks]` remains a valid
# install for SDK users, who do not need SPIFFE.
conflicts = [
    [{ extra = "spiffe" }, { extra = "autogen" }],
    [{ extra = "spiffe" }, { extra = "frameworks" }],
]

[tool.ruff]
line-length = 120
target-version = "py311"

# Bandit SAST config (used by pre-commit + security.yml). Skip tests + attack payloads (which
# intentionally contain injection strings). Baseline exclusions are triaged in
# docs/engineering/security-baseline.md; do not broaden `skips` without a recorded rationale.
[tool.bandit]
exclude_dirs = ["tests", "norviq/redteam", ".venv"]
skips = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root on sys.path so `from tests.conftest import ...` resolves under a
# bare `pytest` invocation (make test), matching `python -m pytest` behavior.
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["norviq*"]

# Ship the non-.py runtime assets. Without this setuptools packages only *.py, so the wheel silently
# dropped norviq/engine/opa-capabilities.json — the locked-down OPA capability set that
# norviq/engine/opa_client.py loads (relative to __file__) to re-compile every submitted rego against
# a compiler that has no http.send/net.*/io.* builtins. That check no-ops when the file is missing
# (opa_client.py: `if not _CAPABILITIES_PATH.exists() ... return`), so its absence is silent.
# Verified by tests/release/test_package_contents.py and asserted again in the publish workflow.
[tool.setuptools.package-data]
"norviq.engine" = ["opa-capabilities.json"]
