# Trivy ignore baseline — every entry is a HIGH/CRITICAL finding we knowingly carry, with the
# rationale recorded here AND in docs/engineering/security-baseline.md. `ignore-unfixed: true` in
# build.yml means only ACTIONABLE findings reach this file: anything listed here has a fixed version
# upstream that we cannot adopt yet.
#
# This is the YAML form of what used to be a flat .trivyignore. The flat file can only suppress a CVE
# *everywhere*, which is wrong when the same CVE is real in one artifact and unreachable in another —
# see CVE-2026-56852 below, which we FIXED in our own Go binary and can only accept in a third-party
# one. `paths` keeps the gate armed where the fix applies.
#
# Adding an entry is a security decision, not a build fix. Each needs: what the finding is, where it
# comes from, why it is not exploitable in Norviq, and what would let us drop the line.

vulnerabilities:
  # SCOPED ON PURPOSE, like CVE-2026-56852 was: the webhook binary pins golang.org/x/net v0.62.0
  # (webhook/go.mod), which fixes this, and without `paths` this entry would disarm the gate there.
  - id: CVE-2026-78661
    paths:
      - usr/local/bin/opa
    statement: >-
      HIGH, quadratic time when golang.org/x/net/html coalesces text nodes (GO-2026-6860), fixed in
      x/net 0.62.0. Reported against x/net v0.60.0 in the PINNED OPA binary (opa 1.21.4-static) in
      the api/engine images. NOT FIXABLE BY BUMP TODAY: every OPA release from v1.21.4 through
      v1.22.3 (2026-11-10) requires x/net v0.60.0. ACCEPTED: the vulnerable package is not in the
      binary. `go tool nm` on the released opa_linux_amd64_static and opa_linux_arm64_static (the
      sha256s Dockerfile.api and Dockerfile.engine verify) finds no golang.org/x/net/html symbol,
      against 206 for golang.org/x/net/http2, and `govulncheck -mode=binary` reports GO-2026-6860 at
      module level only, while it reports 125 symbol-level findings in the same binary. The chart's
      OPA sidecar image is a build of the same OPA commit. Revisit when an OPA release requires
      x/net >= 0.62.0.

# Before CVE-2026-78661 the list was empty, and that was a result rather than an oversight: all
# three earlier entries were cleared at once by
# pinning OPA 1.19.0 (F-001). Each had an explicit exit condition written when it was added, and the
# bump met all three:
#
#   CVE-2026-39822      "when an OPA release built with Go >= 1.26.5 is pinned"
#                       -> 1.19.0 is built with go1.26.5 (`go version` on the released binary).
#                          The entry also covered the webhook binary, which builds FROM
#                          golang:1.26-alpine and therefore also resolves to >= 1.26.5.
#   GHSA-hrxh-6v49-42gf "when an OPA release built against grpc-go >= 1.82.1 is pinned"
#                       -> 1.19.0 requires google.golang.org/grpc v1.82.1 (was v1.81.1 in 1.18.x).
#   CVE-2026-56852      "when an OPA release requires x/text >= 0.39.0"
#                       -> 1.19.0 requires golang.org/x/text v0.40.0 (was v0.38.0 in 1.18.x).
#
# Removing a suppression is the safe direction and is why these went rather than being version-bumped
# in place: if any of them is still present, the fail-closed Trivy gate in build.yml goes red and says
# so, whereas a STALE entry silently disarms the gate for a CVE the shipped binary no longer has — and
# would keep it disarmed if a later OPA regressed. Verified from the released artifacts, not from the
# scanner: `docker` was unavailable on this machine, so CI's Trivy run is the confirming check.
