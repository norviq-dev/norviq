#
# TEMPLATE ONLY -- DO NOT APPLY THIS FILE AND DO NOT PUT REAL VALUES IN IT.
#
# It exists to document the shape the manifests expect: a Secret named `chatbot-secrets` in
# chatbot-prod with exactly the two keys below. Both the chatbot container and all three MCP
# firewall sidecars reference it by secretKeyRef, so a missing key stops the pod at
# CreateContainerConfigError rather than failing at first use.
#
# CREATE THE REAL ONE IMPERATIVELY -- it never becomes a file, so it cannot be committed:
#
#   kubectl -n chatbot-prod create secret generic chatbot-secrets \
#     --from-literal=GROQ_API_KEY="$GROQ_API_KEY" \
#     --from-literal=NRVQ_API_TOKEN="$NRVQ_API_TOKEN"
#
# Read those two from your own environment or secret manager; do not type them on the command line,
# where they land in shell history. `stringData` below is plain text on purpose: base64 is an
# encoding, not encryption, and a `data:` block invites the belief that a committed secret is
# somehow protected. Two credential leaks on this project came in through exactly that door.
#
# ROTATION. Pods do not pick up a changed Secret through secretKeyRef -- env is resolved once at
# container start. After rotating, restart the workload:
#   kubectl -n chatbot-prod rollout restart deployment/demo-chatbot
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-secrets
  namespace: chatbot-prod
type: Opaque
stringData:
  # Groq API key for the LLM the agent runs on. Free key from console.groq.com.
  GROQ_API_KEY: "REPLACE_ME_groq_api_key"
  # Bearer token for the Norviq API. /api/v1/evaluate requires one, and the SDK fails CLOSED
  # without it -- an absent or expired token blocks every tool call rather than allowing it, which
  # looks exactly like an over-strict policy. Mint with POST /api/v1/auth/login.
  NRVQ_API_TOKEN: "REPLACE_ME_norviq_api_token"
