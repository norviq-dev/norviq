#
# OpenSSF Scorecard. Before this the project had no score at all — the public API returned 404 for
# norviq-dev/norviq while returning 200 for kubernetes/kubernetes, i.e. the weekly public crawl had
# never picked the repo up. Running the action with publish_results makes the score exist, and the
# SARIF lands in code scanning so each finding is visible next to the code it is about.
#
# The shape is upstream's own example and should stay that way: `publish_results: true` is only
# accepted from a job with no top-level env/defaults and no `run:` steps, so adding a convenience
# step here silently turns publishing off rather than failing.
name: Scorecard

on:
  push:
    branches: [main]   # Scorecard only supports the default branch.
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # OIDC for publish_results
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
