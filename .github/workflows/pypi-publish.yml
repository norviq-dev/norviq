# SPDX-License-Identifier: Apache-2.0
# Build the `norviq` sdist + wheel and validate them. THIS WORKFLOW NO LONGER PUBLISHES.
#
# The actual upload lives inline in release.yml's `pypi` job. That is forced by PyPI, not preference —
# from their troubleshooting docs: "Reusable workflows cannot currently be used as the workflow in a
# Trusted Publisher" (warehouse#11096).
#
# v0.1.3 is the evidence. When release.yml called this file via `workflow_call`, the run produced two
# different workflow identities: the OIDC token carried `job_workflow_ref` (= pypi-publish.yml, the
# workflow containing the job) while the PEP 740 attestation was signed with a certificate naming the
# TOP-LEVEL workflow (= release.yml). PyPI accepted the token and then rejected the upload:
#
#     Certificate's Build Config URI (.../release.yml@refs/tags/v0.1.3) does not
#     match expected Trusted Publisher (pypi-publish.yml @ norviq-dev/norviq)
#
# It failed closed — nothing was uploaded and 0.1.3 stayed free — which is exactly what the "pypi runs
# last" ordering exists to guarantee. But it cost a release run, so the configuration is now the one
# PyPI documents as supported: a single publisher registered against release.yml.
#
# WHAT THIS FILE IS FOR NOW: `workflow_dispatch`, to build the distribution and run the same gates the
# release runs (version reconciliation, `twine check`, wheel-contents assertion) WITHOUT uploading.
# That is worth keeping — it is the only way to validate packaging without spending a version.
#
# The PyPI Trusted Publisher must name **release.yml**. If it still names pypi-publish.yml, the upload
# fails on the attestation check as above.
#
# To release: push a tag (e.g. `git tag v0.1.4 && git push origin v0.1.4`) — release.yml drives it.
# Consumers then: pip install "norviq[langchain]"
name: Build distribution (validate only)

on:
  # No workflow_call: release.yml publishes inline (see the header). No push/tag trigger either —
  # this file must never be a second path to an upload.
  workflow_dispatch: {} # build + validate only — never publishes

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NO `id-token: write`. Without an OIDC token this job cannot mint a Trusted Publishing
    # credential even if someone later pastes an upload step in — the inability to publish is
    # enforced by the permission set, not just by the absence of the step.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # No-argument form: assert Chart.yaml and pyproject agree with EACH OTHER. There is no tag here
      # (workflow_dispatch only), and passing a literal would just re-check whatever was typed.
      - name: Versions must agree with each other
        run: |
          set -euo pipefail
          python3 scripts/check_release_versions.py

      - name: Build + validate the distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build                 # -> dist/*.whl + dist/*.tar.gz
          python -m twine check dist/*    # metadata/README render check

      # `twine check` validates metadata and that the README renders — it does NOT look inside the
      # wheel. Assert the package data the code loads at runtime is actually present, so a packaging
      # regression is caught HERE, where it costs nothing, rather than in a release where the upload
      # is immutable.
      - name: The wheel must contain the runtime assets, not just .py files
        run: python3 scripts/check_wheel_contents.py dist

      - name: Summary
        run: |
          echo "::notice::Distribution built and validated. NOTHING was uploaded — publishing happens \
          only in release.yml's inline pypi job, on a v*.*.* tag."
