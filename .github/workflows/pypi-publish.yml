# SPDX-License-Identifier: Apache-2.0
# Build the `norviq` sdist + wheel and publish to PyPI via Trusted Publishing (OIDC — no API token).
#
# NOT triggered by the release tag directly. release.yml calls this as its LAST job, gated on the
# image and chart jobs succeeding.
#
# It used to fire on `v*.*.*` independently, which meant the two workflows raced: a Release that died
# at the chart push had already uploaded the wheel. That is not a recoverable mistake — PyPI never
# lets a version be re-uploaded or reused, only yanked — and it is exactly how 0.1.0 and 0.1.1 became
# permanently burnt version numbers for failures that had nothing to do with the wheel. Being called
# by release.yml gives the ordering that no cross-workflow `needs:` can express.
#
# DORMANT by design — this cannot release accidentally:
#   * The publish step runs ONLY on a pushed v*.*.* tag; workflow_dispatch builds + validates only.
#   * Trusted Publishing requires a matching publisher configured on PyPI
#     (PyPI → project → Publishing → GitHub publisher: owner norviq-dev, repo norviq,
#      workflow pypi-publish.yml). Until that exists the publish step fails WITHOUT uploading.
#     The configured workflow filename stays `pypi-publish.yml` even though release.yml is now the
#     entry point: the publish step still RUNS here, and PyPI matches the OIDC `job_workflow_ref`
#     claim, which names the workflow containing the job — not the caller.
#
# To release: push a tag (e.g. `git tag v0.1.3 && git push origin v0.1.3`) — release.yml drives the
# whole sequence. Consumers then: pip install "norviq[langchain]"
name: Publish to PyPI

on:
  workflow_call: {}     # release.yml, after images + chart have succeeded
  workflow_dispatch: {} # build + `twine check` only — never publishes

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing (no stored secret)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # Gate 0: the tag IS the version. PyPI will not let you re-upload 0.1.0 to correct a mistake,
      # so a tag that disagrees with pyproject.toml/Chart.yaml must stop the run before `build`.
      - name: Versions must agree with the tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python3 scripts/check_release_versions.py "${GITHUB_REF_NAME#v}"
          else
            python3 scripts/check_release_versions.py
          fi

      - name: Build + validate the distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build                 # -> dist/*.whl + dist/*.tar.gz
          python -m twine check dist/*     # metadata/README render check before any upload

      # `twine check` validates metadata and that the README renders — it does NOT look inside the
      # wheel. Assert the package data the code loads at runtime is actually present, so a packaging
      # regression fails here rather than becoming an immutable upload.
      - name: The wheel must contain the runtime assets, not just .py files
        run: python3 scripts/check_wheel_contents.py dist
      - name: Publish to PyPI (Trusted Publishing) — tag pushes only
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
