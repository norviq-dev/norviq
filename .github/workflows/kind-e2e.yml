#
# The gap `test.yml` names explicitly: `tests/integration` and `tests/attacks` are excluded from the
# PR gate because they need a running cluster, and that comment ends with "they belong in a
# kind-based e2e job, not a PR gate". This is that job.
#
# Excluded from the PR gate is correct. Excluded and never run ANYWHERE is not: these 162 tests are
# the only ones that exercise the real evaluate path, real Postgres, real Redis, and the console
# against a real API. Until this job existed they ran on one developer's laptop, sometimes.
#
# ⚠ WHY THIS JOB CANNOT JUST CALL PYTEST. `tests/attacks/conftest.py` xfails and
# `tests/integration/conftest.py` skips when the backend is unreachable — both exit 0. A run against
# a broken cluster prints "97 xfailed" and passes. `scripts/kind-e2e/l3.sh` asserts a nonzero PASSED
# count per suite for exactly that reason; its thresholds come from measured live-vs-dead numbers,
# and it has been verified to fail against a dead API rather than merely to pass against a live one.

name: kind-e2e

on:
  workflow_dispatch:
  schedule:
    # Nightly. This is a slow, cluster-shaped job — running it per-PR would add ~25 minutes to every
    # push to prove things that change rarely. A nightly failure is still found within a day.
    - cron: "0 3 * * *"
  pull_request:
    # ...except when a PR touches the things this job is the only cover for.
    paths:
      - "norviq/engine/**"
      - "norviq/api/routers/**"
      - "webhook/**"
      - "helm/**"
      - "tests/integration/**"
      - "tests/attacks/**"
      - "scripts/kind-e2e/**"
      - ".github/workflows/kind-e2e.yml"

permissions:
  contents: read

concurrency:
  group: kind-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-e2e:
    name: L3 + L4 against a real cluster (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # SHARDED. Serially the browser suite took 114 minutes and was killed at the cap having produced
    # no tally at all — five runs in a row reported nothing about the product in either direction.
    #
    # The split is across JOBS, not workers. playwright.config.ts keeps --workers=1 deliberately:
    # every worker shares one storageState token against a backend with a single admin identity, so a
    # spec that logs out or rotates the password breaks whatever runs beside it (measured: 3 workers
    # gave 21 failed / 12 flaky). Each shard is its own job with its own kind cluster and its own
    # admin, so the contention that made workers unsafe simply is not there.
    #
    # The cost is honest: every leg rebuilds a cluster, so setup is paid 4x (~7 min each). It buys
    # wall-clock ~36 min instead of >120, and — the part that matters — a result.
    #
    # fail-fast: false because a failing shard must not hide the other three. The point of this job is
    # the complete picture, and "3 of 4 green" is not green: Playwright shards by file, so every spec
    # lands in exactly one shard and a missing leg is missing COVERAGE, not a flake to retry.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 120, not 60. The cap was sized when ~28 specs died on a 20-second login timeout and L4
    # finished in 26 minutes; with the login gate actually running, those specs execute their real
    # flows and L4 reached 124 of 196 in 53 minutes before being cut. Two workers is deliberate —
    # playwright.config.ts warns that more of them contend on the single kind backend — so the
    # suite needs time rather than concurrency.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1

      - uses: actions/setup-python@e9d6f990972a57673cdb72ec29e19d42ba28880f # v6.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # Same pinned version + checksum as test.yml, so every layer evaluates rego against the dialect
      # the sidecar actually runs. `l3.sh` refuses to start without it rather than letting the
      # rego-backed tests skip into a green summary.
      - name: install opa
        run: |
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 \
            -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/v1.19.1/opa_linux_amd64_static
          echo "c9f985ce0d345f5484006ade2c695ed9e3f308e4441139e46695c5c182ac0839  /usr/local/bin/opa" | sha256sum -c -
          chmod +x /usr/local/bin/opa
          opa version

      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: norviq-local
          wait: 120s
          # Publishes NodePort 30080 on the host at 127.0.0.1:3400, so the console is reachable
          # without a port-forward. See the file for why the forward had to go.
          config: .github/kind/e2e-cluster.yaml

      - name: Python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      # FIVE images, not four. `bootstrap` runs behind a Helm hook rather than as a Deployment, so a
      # cluster without it fails during install on the `norviq-internal-tls` hook — a failure that
      # reads as a chart problem rather than a missing image.
      #
      # No `--platform`: pinning it produces `exec format error` on a runner whose arch differs from
      # the pin, and the failure surfaces as a CrashLoopBackOff with no useful message.
      #
      # The webhook is the ODD ONE OUT and the loop used to assume it was not: its Dockerfile lives at
      # `webhook/Dockerfile` with `webhook/` as the build CONTEXT, not `Dockerfile.webhook` at the root
      # like the other four. `docker build -f Dockerfile.webhook .` therefore failed with
      # "failed to read dockerfile: open Dockerfile.webhook: no such file or directory" and took this
      # whole job down before a single test ran. scripts/push_dev_image.sh already carries the correct
      # per-component mapping; this mirrors it rather than inventing a second one.
      - name: Build and load the five images
        run: |
          for img in api ui engine bootstrap; do
            docker build -t "norviq/norviq-engine:${img}-latest" -f "Dockerfile.${img}" .
          done
          docker build -t "norviq/norviq-engine:webhook-latest" -f webhook/Dockerfile webhook
          kind load docker-image --name norviq-local \
            norviq/norviq-engine:api-latest \
            norviq/norviq-engine:ui-latest \
            norviq/norviq-engine:engine-latest \
            norviq/norviq-engine:webhook-latest \
            norviq/norviq-engine:bootstrap-latest

      # Every namespace in `policyQuotaNamespaces` must EXIST before install, or the chart fails
      # applying a quota to a namespace that is not there.
      - name: Install the chart
        run: |
          kubectl apply -f helm/norviq/crds/
          for ns in norviq agents analytics; do
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
          done
          # policyQuotaNamespaces is REQUIRED here, and the chart is right to refuse without it:
          # baselineClusterPolicy.enabled defaults true and renders ONE guard per namespace in this
          # list, so an empty list would install a cluster with NO baseline at all while NOTES.txt
          # claims one is present. values-light.yaml does not set it, so the install died on that
          # guard ("baselineClusterPolicy.enabled=true but policyQuotaNamespaces is EMPTY").
          #
          # These are the tenant namespaces created immediately above — and they must exist BEFORE
          # install, which is why the creation loop precedes this step rather than following it.
          helm install norviq helm/norviq \
            -n norviq \
            -f helm/norviq/values-light.yaml \
            -f scripts/kind-e2e/values-e2e.yaml \
            --set policyQuotaNamespaces='{agents,analytics}' \
            --set images.api.pullPolicy=IfNotPresent \
            --set images.ui.pullPolicy=IfNotPresent \
            --set images.engine.pullPolicy=IfNotPresent \
            --set images.webhook.pullPolicy=IfNotPresent \
            --wait --timeout 10m
          kubectl -n norviq get pods

      - name: Mint an admin token
        run: |
          api_pod="$(kubectl -n norviq get pods -o name | grep api | head -1)"
          kubectl -n norviq exec "${api_pod#pod/}" -c api -- \
            python -m norviq.api.token_mint --ttl 7200 | tail -1 > /tmp/nrvq-signin-token.txt
          test -s /tmp/nrvq-signin-token.txt

      # THE PATCH IS WHAT MAKES THE NodePort REAL. The cluster config publishes host 127.0.0.1:3400 ->
      # node:30080, but nothing puts a Service on 30080 until this runs. Adding the mapping without
      # this step is worse than not adding it: every request is accepted by docker, forwarded to a
      # port with no listener, and reset. That is exactly what run 32314397336 did — 27
      # ERR_CONNECTION_RESET on localhost:3400 in the shard that ran longest, while the step below
      # still carried `kubectl port-forward ... &` and the NodePort work sat unused in
      # scripts/kind-e2e/00-up.sh, which this job does not run.
      #
      # There is deliberately NO port-forward here and no fallback to one. The forward is the single
      # largest source of failure this job has ever had (it dies without the kubectl process exiting,
      # so it cannot be supervised by watching for process death), and a fallback would let the same
      # bug hide again by quietly restoring the path the NodePort exists to delete. If the NodePort
      # does not serve, the job fails and says so.
      - name: Publish the console on the NodePort the cluster maps
        run: |
          set -euo pipefail
          kubectl -n norviq patch svc norviq-ui -p \
            '{"spec":{"type":"NodePort","ports":[{"port":80,"targetPort":"http","nodePort":30080}]}}'

          # Nothing else listens on 3400, so a 200 here can only have come through kube-proxy.
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3400/ && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:3400/; then
            echo "::error::console not reachable on the published NodePort 30080"
            kubectl -n norviq get svc norviq-ui -o wide
            kubectl -n norviq get endpoints norviq-ui -o wide
            kubectl -n norviq get pods -l app.kubernetes.io/component=ui -o wide
            exit 1
          fi
          echo "console reachable at 127.0.0.1:3400 via NodePort 30080 (no tunnel in the path)"

      - name: Seed the console's fixtures
        run: .venv/bin/python scripts/kind-e2e/seed.py

      # L4 — the console against the real API. `scripts/e2e.sh` owns the Playwright invocation; adding
      # a second runner here would let the two drift.
      - name: L4 · Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3400
          NRVQ_TOKEN_FILE: /tmp/nrvq-signin-token.txt
          NRVQ_E2E_CONTAINER: "1"
          NRVQ_E2E_SHARD: "${{ matrix.shard }}/4"
        run: |
          # No browser install here at all. scripts/e2e.sh runs the suite inside
          # mcr.microsoft.com/playwright:<lockfile version>-noble, which ships the browsers and their
          # system libraries, so apt is never on the path.
          #
          # It was on the path for five consecutive runs and none of them reported anything about the
          # product: azure.archive answers `Ign:` for every index, the fallback mirror fetches InRelease
          # and then hangs on the package lists. Bounding it, retrying it and rewriting the mirror all
          # reduced the damage without removing the dependency. This removes the dependency.
          bash scripts/e2e.sh

      # L3 LAST, deliberately. It creates policies in throwaway `integration-<uuid>` namespaces, and a
      # namespace EXISTS as far as the console is concerned the moment a policy names one — so running
      # it first grew the namespace selector by ten phantom entries and broke the browser suite's
      # policy counts, catalog listings, pack rollups and namespace-scoped graph views. Fifty-nine
      # specs failed in files unrelated to any change, pointing at the console rather than at the
      # cause. `tests/integration/conftest.py` now sweeps those rows at session end; this ordering is
      # the second line of defence, because a cleanup that fails must not silently poison L4.
      - name: L3 · integration + attacks
        # ONE shard runs L3. It creates policies in throwaway `integration-<uuid>` namespaces, and a
        # namespace EXISTS as far as the console is concerned the moment a policy names one — running
        # it on all four legs multiplies that debris across four clusters for no extra signal, since
        # L3 does not shard.
        if: matrix.shard == 1
        run: scripts/kind-e2e/l3.sh

      # Runs even when a step above failed. A red cluster run without the state behind it is a
      # guessing game, and reproducing it costs another 25 minutes.
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods,jobs,svc -A -o wide || true
          kubectl -n norviq describe pods || true
          kubectl -n norviq logs -l app.kubernetes.io/component=api --tail=300 || true
          kubectl -n norviq logs -l app.kubernetes.io/component=engine --tail=200 || true
          kubectl get nrvqpolicies -A -o yaml || true

          # THE CONSOLE PATH. There is no tunnel to inspect any more — the console is a NodePort. So
          # dump the three things that path is made of, because a dead one of them is what
          # ERR_CONNECTION_RESET on 3400 actually means: the Service must be type NodePort on 30080,
          # it must have endpoints, and the mapping must answer.
          #
          # The step this replaces tailed /tmp/nrvq-kind-ui.log and grepped for a supervisor process.
          # Both were already vestigial when they ran, and "no port-forward log" printed on every
          # failure while reading as a finding. A diagnostic that cannot come back false is not one.
          echo "----- norviq-ui service (must be NodePort 30080) -----"
          kubectl -n norviq get svc norviq-ui -o wide || true
          echo "----- norviq-ui endpoints (empty here = RST on 3400) -----"
          kubectl -n norviq get endpoints norviq-ui -o wide || true
          echo "----- can the console be reached from here, now? -----"
          curl -sS -o /dev/null -w "console HTTP %{http_code} in %{time_total}s\n" --max-time 10 \
            "http://127.0.0.1:${NRVQ_UI_PORT:-3400}/" || echo "console unreachable at dump time"
          echo "----- pod restarts -----"
          kubectl -n norviq get pods -o custom-columns=NAME:.metadata.name,RESTARTS:.status.containerStatuses[*].restartCount,AGE:.metadata.creationTimestamp || true

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts
          path: ui/tests/e2e/artifacts/
          retention-days: 7
          if-no-files-found: ignore
