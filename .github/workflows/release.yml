# SPDX-License-Identifier: Apache-2.0
# Cut a Norviq release from a `v*.*.*` tag: build the four images at that tag, then publish a Helm
# chart that pins them BY DIGEST, and cosign-sign the chart.
#
# Why the chart pins digests. A chart that says `api-latest` is not a release: `helm install
# --version 0.1.0` a year from now would deploy whatever is on main today, two people installing
# "the same version" get different binaries, and a pod reschedule silently upgrades a running
# install. It also hollows out the signature below — signing a chart whose only image reference is
# the string "api-latest" attests ~50 KB of YAML and says nothing about the binaries that enforce
# policy. So the chart is rewritten at package time to reference immutable sha256 digests.
#
# Why the images are built HERE rather than in build.yml on its own. The chart must not be published
# before the images it pins exist. `needs:` expresses that, but ONLY between jobs of a single
# workflow run — there is no cross-workflow `needs:`. So build.yml is invoked as a REUSABLE workflow
# (workflow_call) and becomes a job in this run that `chart` can depend on.
#
# Why the rehearsal pushes to a SEPARATE chart repo rather than skipping the push. Releases v0.1.0
# and v0.1.1 both failed in steps a "publishes nothing" rehearsal could not reach: v0.1.0 published a
# wheel and no chart at all, v0.1.1 published the chart UNSIGNED because `helm registry login` writes
# Helm's own credential file while cosign reads the DOCKER credential store, so the signature push
# went out unauthenticated. A rehearsal that skips push and sign is green in both cases — it reports
# success for exactly the two steps that break. So the rehearsal now performs a real authenticated
# push and a real keyless signature against ghcr.io, into `charts-rehearsal/` instead of `charts/`.
# Same registry host, same token, same OIDC identity, same code path; nothing lands in the repo
# consumers install from. A local throwaway registry would NOT do: it needs no auth, so it cannot
# catch the credential-store split that actually broke v0.1.1.
#
# Why PyPI is a job HERE rather than its own tag-triggered workflow. pypi-publish.yml used to fire on
# the same `v*.*.*` tag independently, so a Release that died at the chart step still uploaded the
# wheel — and PyPI versions cannot be re-uploaded or reused, only yanked. That is how 0.1.0 and 0.1.1
# became permanently burnt versions. It is now a `workflow_call` invoked as the LAST job, gated on
# images AND chart succeeding, so the irreversible action happens only once everything reversible has.
#
# Consumers then:
#   helm install norviq oci://ghcr.io/norviq-dev/charts/norviq --version <x.y.z>
#   cosign verify ghcr.io/norviq-dev/charts/norviq:<x.y.z> \
#     --certificate-identity-regexp '^https://github.com/norviq-dev/norviq/.github/workflows/release.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# The GitHub Release for the tag also carries the wheel, the sdist, the chart .tgz and an SBOM, each
# with a keyless Sigstore bundle (`<file>.sigstore.json`) from the same release.yml identity:
#   cosign verify-blob norviq-<x.y.z>-py3-none-any.whl \
#     --bundle norviq-<x.y.z>-py3-none-any.whl.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/norviq-dev/norviq/.github/workflows/release.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Release

on:
  push:
    tags: ["v*.*.*"]
  # REHEARSAL. Builds, renders, validates, and performs a REAL push + signature into the
  # `charts-rehearsal/` repo. Publishes nothing consumers can reach: no version-tagged images, no
  # chart in `charts/`, no PyPI upload. See the header note above for why it is not a no-op.
  workflow_dispatch: {}

# Read-only by default. Jobs that need more ask for it in their own `permissions:` block.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/norviq-dev/norviq-engine
  # No `oci://` prefix: helm push needs it, cosign must NOT have it, so each consumer adds its own.
  CHART_REPO: ghcr.io/norviq-dev/charts
  CHART_REPO_REHEARSAL: ghcr.io/norviq-dev/charts-rehearsal

jobs:
  # ---------------------------------------------------------------------------------------------
  # Gate 0: the tag IS the version. Four numbers must agree before anything is built or published:
  # the git tag, Chart.yaml version, Chart.yaml appVersion, and the pyproject version — otherwise a
  # `v0.2.0` tag silently publishes a chart labelled 0.1.0 and a wheel labelled 0.1.0.
  # ---------------------------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            # Rehearsal: derive the version from Chart.yaml so every later step runs for real.
            version="$(python3 -c 'import re,sys;print(re.search(r"^version:\s*(\S+)",open("helm/norviq/Chart.yaml").read(),re.M).group(1))')"
            publish=false
            echo "::notice::Rehearsal run (no tag). Building and validating v${version}. The chart \
            IS pushed and signed for real, into charts-rehearsal/ — nothing reachable by consumers \
            is published: no version-tagged images, no chart in charts/, no PyPI upload."
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          python3 scripts/check_release_versions.py "${version}"

  # ---------------------------------------------------------------------------------------------
  # The four multi-arch images, at this tag, scanned fail-closed, cosign-signed, SBOM-attested.
  # Reusable call so that `chart` can `needs:` it — see the header note on ordering.
  # ---------------------------------------------------------------------------------------------
  images:
    needs: version
    # SKIPPED on a rehearsal. A rehearsal must publish nothing, and this job pushes
    # `<component>-<version>` to a public registry — which would mint the GA image tags early. On a
    # rehearsal the chart job instead pins the CURRENT commit's `<component>-<sha>` images, which
    # already exist from the main build, so the whole stamp/pin/render/package path is still
    # exercised against real digests.
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ needs.version.outputs.version }}

  chart:
    needs: [version, images]        # <-- the ordering guarantee: images exist before the chart pins them
    # `needs` on a skipped job would skip this one too, so accept skipped-but-not-failed explicitly.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.images.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write        # push the OCI chart to GHCR with the built-in token
      id-token: write        # keyless cosign signing via the workflow's OIDC identity
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Log in first: resolving digests reads the registry, and on a rehearsal the images are
      # published by `images` above, so they are always resolvable by the time we get here.
      - name: Log in to GHCR
        # TWO logins, deliberately. `helm registry login` writes Helm's OWN config and is what
        # `helm push` uses. cosign does not read that — it reads the Docker credential store, so
        # without the docker/login-action below it pushes the signature layer UNAUTHENTICATED and
        # fails with `UNAUTHORIZED: unauthenticated` *after* the chart has already published. That
        # split is why v0.1.1 shipped an unsigned chart: helm push succeeded, cosign did not.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Log in to GHCR for cosign (Docker credential store)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolves each just-built `<component>-<version>` tag to its immutable index digest and writes
      # it into images.<component>.digest, which the chart's `norviq.image` helper prefers over tag.
      # Logic lives in scripts/release_stamp.py (unit-tested in tests/release/) rather than inline
      # here, because a bug in it publishes a chart pointing at the wrong binaries — permanently.
      - name: Stamp the chart version and pin every image to an immutable digest
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            # Release: pin the version-tagged images the `images` job just published.
            python3 scripts/release_stamp.py "$VERSION" --resolve
          else
            # Rehearsal: no version-tagged images exist, so pin whatever `-latest` currently
            # resolves to. NOT `<comp>-$GITHUB_SHA`: build.yml has path filters, so a commit that
            # touches only release plumbing never builds images and those tags would not exist.
            # `-latest` always exists, and we still pin its immutable digest — same code path,
            # real digests, nothing published.
            python3 scripts/release_stamp.py "$VERSION" --resolve --resolve-suffix latest
          fi
          echo "--- Chart.yaml ---"; grep -E '^(version|appVersion):' helm/norviq/Chart.yaml

      - name: Lint and render the chart that will actually ship
        run: |
          set -euo pipefail
          helm lint helm/norviq
          # `helm lint` does NOT execute the fail-closed baseline guard, so lint alone can pass on a
          # chart no consumer can install. Render the real thing, the way the docs tell users to.
          helm template norviq helm/norviq \
            --set-json 'policyQuotaNamespaces=["default"]' > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
          # EVERY image reference in the shipped chart must be digest-pinned: Norviq's own (stamped
          # above), the third-party ones (global.thirdPartyImageDigests in values.yaml) and the
          # injected sidecar's NRVQ_SIDECAR_IMAGE. This used to grep ghcr.io/norviq-dev/ lines only and
          # passed with opa, valkey, postgres, nginx, busybox and curl on bare tags — see the script.
          python3 scripts/check_image_pins.py /tmp/rendered.yaml

      - name: Package
        run: |
          set -euo pipefail
          helm package helm/norviq -d dist/
          ls -l dist/
          # The packaged tgz — not the working tree — is what consumers get. Prove it renders, and
          # that what it renders is still pinned: the gate above read the working tree.
          helm template norviq dist/norviq-"$VERSION".tgz \
            --set-json 'policyQuotaNamespaces=["default"]' > /tmp/rendered-tgz.yaml
          python3 scripts/check_image_pins.py /tmp/rendered-tgz.yaml
          echo "packaged chart renders from the .tgz"

      # Runs on BOTH paths. On a tag it publishes to `charts/`; on a rehearsal to
      # `charts-rehearsal/`. Deliberately NOT gated on `publish` — see the header note: skipping this
      # on a rehearsal is what let v0.1.0 and v0.1.1 fail here after a green dry run.
      - name: Push chart (release -> charts/, rehearsal -> charts-rehearsal/)
        id: push
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then repo="$CHART_REPO"; else repo="$CHART_REPO_REHEARSAL"; fi
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "pushing to oci://${repo}"
          # `set -o pipefail` makes the pipeline fail if `helm push` fails; `tee` keeps the log.
          helm push dist/norviq-"$VERSION".tgz "oci://${repo}" 2>&1 | tee push.log
          # Parse the digest from the "Digest: sha256:..." line specifically. A bare grep for the
          # first sha256 in the whole log could match an unrelated line and sign the wrong thing.
          digest="$(sed -n 's/^Digest:[[:space:]]*\(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | head -n1)"
          if [ -z "$digest" ]; then
            echo "::error::could not parse the chart digest from 'helm push' output — refusing to sign" >&2
            echo "--- helm push output ---" >&2; cat push.log >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (keyless, Sigstore)
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.push.outputs.repo }}/norviq@${{ steps.push.outputs.digest }}"

      # `cosign sign` exiting 0 is not proof a consumer can verify: v0.1.1's signature push failed
      # only at the registry, after the chart was already public. Verify with the SAME command the
      # header and the runbook hand to users, so a signature that cannot be checked fails the release
      # instead of shipping. On a rehearsal the signing identity is release.yml@refs/heads/<branch>,
      # which the identity regexp below matches just as it does a tag.
      - name: Verify the signature we just produced
        run: |
          set -euo pipefail
          cosign verify "${{ steps.push.outputs.repo }}/norviq@${{ steps.push.outputs.digest }}" \
            --certificate-identity-regexp '^https://github.com/norviq-dev/norviq/.github/workflows/release.yml@.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verifies against the documented cosign command"

      # Tag only. The same .tgz that was pushed and signed above, handed to `release-sign` below.
      - name: Keep the packaged chart for the GitHub Release
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-chart
          path: dist/norviq-${{ env.VERSION }}.tgz
          if-no-files-found: error
          retention-days: 7
          overwrite: true      # a re-run of this job replaces the earlier attempt's file

      - name: Rehearsal summary
        if: needs.version.outputs.publish != 'true'
        run: |
          echo "::notice::Rehearsal complete — versions reconciled, chart version-stamped, images \
          digest-pinned from -latest, linted, rendered, packaged, the .tgz re-rendered, and the \
          chart PUSHED AND SIGNED for real into ${CHART_REPO_REHEARSAL} (signature verified). \
          Not exercised (tag-only): the image build/scan/sign job, the PyPI upload, and the \
          GitHub Release jobs. Nothing \
          reachable by consumers was published. Push a v*.*.* tag to run those for real."

  # ---------------------------------------------------------------------------------------------
  # LAST, and only on a tag. A PyPI version is the one artifact in this release that cannot be
  # withdrawn — `pip install norviq==x.y.z` keeps working after a yank, and the number can never be
  # reused. So it goes after everything that CAN be retried: if the images fail to build or the chart
  # fails to push or sign, the wheel is simply never uploaded and the same version can be re-tagged.
  #
  # The publish step still lives inside pypi-publish.yml, so the OIDC `job_workflow_ref` claim
  # PyPI matches its Trusted Publisher against is unchanged — the existing publisher configured for
  # `pypi-publish.yml` keeps working without a PyPI-side edit. If that assumption is ever wrong the
  # failure is closed, not silent: Trusted Publishing rejects the token and nothing is uploaded.
  # ---------------------------------------------------------------------------------------------
  # These steps are INLINE rather than a `uses:` call to pypi-publish.yml, and that is a hard
  # requirement, not a style choice. From PyPI's own troubleshooting docs:
  #
  #     "Reusable workflows cannot currently be used as the workflow in a Trusted Publisher."
  #     (tracked in warehouse#11096)
  #
  # v0.1.3 proved what that costs. Calling pypi-publish.yml via `workflow_call` produces two DIFFERENT
  # workflow identities: the OIDC token carries `job_workflow_ref` (the workflow containing the job =
  # pypi-publish.yml) while the PEP 740 attestation is signed with a certificate whose Build Config URI
  # is the TOP-LEVEL workflow (= release.yml). PyPI accepted the token and then rejected the upload:
  #
  #     Certificate's Build Config URI (.../release.yml@refs/tags/v0.1.3) does not
  #     match expected Trusted Publisher (pypi-publish.yml @ norviq-dev/norviq)
  #
  # Registering a second publisher would paper over that while leaving a configuration PyPI does not
  # support. Inlining makes both claims name release.yml, so ONE publisher matches both.
  #
  # The ordering guarantee from the reusable-workflow version is unchanged and is the whole point:
  # this job still runs LAST, gated on images AND chart succeeding, because a PyPI version cannot be
  # re-uploaded or reused — only yanked. pypi-publish.yml is kept for `workflow_dispatch` build+validate.
  pypi:
    needs: [version, images, chart]
    if: >-
      ${{ !cancelled()
          && needs.version.outputs.publish == 'true'
          && needs.images.result == 'success'
          && needs.chart.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write        # OIDC token for Trusted Publishing (no stored secret)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Gate 0 again, locally. `version` already reconciled the tag, but this job builds the artifact
      # that PyPI keeps forever, so it re-checks rather than trusting an upstream job's output.
      - name: Versions must agree with the tag
        run: |
          set -euo pipefail
          python3 scripts/check_release_versions.py "${GITHUB_REF_NAME#v}"

      - name: Build + validate the distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build                 # -> dist/*.whl + dist/*.tar.gz
          python -m twine check dist/*    # metadata/README render check before any upload

      # `twine check` validates metadata and that the README renders — it does NOT look inside the
      # wheel. Assert the package data the code loads at runtime is actually present, so a packaging
      # regression fails here rather than becoming an immutable upload.
      - name: The wheel must contain the runtime assets, not just .py files
        run: python3 scripts/check_wheel_contents.py dist

      # Before the upload, so a failure here costs nothing. These are the exact files PyPI receives;
      # `release-sign` and `github-release` below sign them and attach them to the GitHub Release.
      - name: Keep the distribution for the GitHub Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true      # a re-run after a failed PyPI upload must not stop here on a 409

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # ---------------------------------------------------------------------------------------------
  # After PyPI, and only on a tag: attach the released files to the GitHub Release for the tag.
  #
  # The chart and the images are signed in GHCR, and PyPI holds the PEP 740 attestation for the
  # wheel. A GitHub Release page carried only the source archives GitHub generates, so someone who
  # downloads from the Release (and tools such as OpenSSF Scorecard that read its assets) found
  # nothing signed there. These three jobs add the wheel and sdist PyPI received, the chart .tgz that
  # was pushed to GHCR, and an SPDX SBOM of the tagged source, each with a Sigstore bundle.
  #
  # Same trust root as everything else in this file: keyless cosign, Fulcio certificate for the
  # release.yml workflow identity, Rekor entry. No key, no new secret. Each bundle is verified with
  # the command the header gives consumers before anything is uploaded.
  #
  # Split three ways so each permission sits with the least code:
  #   release-sbom     contents: read only. The only job that checks out and scans the source.
  #   release-sign     id-token: write only. Downloads, signs, verifies. No checkout, no repo token.
  #   github-release   contents: write only. Downloads the signed set and runs the runner's gh CLI.
  #                    No checkout and no third-party action; GH_TOKEN is set on the one step that
  #                    calls gh, not on the job.
  #
  # Runs after `pypi` because it changes nothing that cannot be redone: if it fails, re-run the
  # failed jobs. Do not publish the Release by hand first: see step 2b (GitHub Release) of "Cutting
  # the release" in docs/engineering/release-runbook.md.
  # ---------------------------------------------------------------------------------------------
  release-sbom:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The lockfiles it reads are uv.lock, ui/package-lock.json and webhook/go.sum, among others.
      - name: Generate SBOM of the tagged source (SPDX)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: ${{ runner.temp }}/norviq-${{ needs.version.outputs.version }}.sbom.spdx.json

      - name: Keep the SBOM for the GitHub Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}/norviq-${{ needs.version.outputs.version }}.sbom.spdx.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true      # a re-run of this job replaces the earlier attempt's file

  release-sign:
    needs: [version, chart, pypi, release-sbom]
    if: >-
      ${{ !cancelled()
          && needs.version.outputs.publish == 'true'
          && needs.chart.result == 'success'
          && needs.pypi.result == 'success'
          && needs.release-sbom.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write        # keyless cosign signing via the workflow's OIDC identity
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Same-run download: authenticates with the runner's artifact token, not the repo token.
      - name: Collect the chart, the distribution and the SBOM from the earlier jobs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Check the asset set
        working-directory: assets
        run: |
          set -euo pipefail
          for f in "norviq-${VERSION}.tgz" "norviq-${VERSION}.tar.gz" "norviq-${VERSION}.sbom.spdx.json"; do
            test -s "$f" || { echo "::error::missing release asset: $f"; exit 1; }
          done
          ls norviq-"${VERSION}"-*.whl > /dev/null || { echo "::error::missing release asset: wheel"; exit 1; }
          ls -l

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Retries for the same reason as build.yml: keyless signing calls the OIDC token endpoint and
      # Sigstore on every attempt, and those fail transiently. Still fail-closed after 5 attempts.
      - name: Sign every asset (keyless, Sigstore bundle)
        env:
          COSIGN_YES: "true"
        working-directory: assets
        run: |
          set -euo pipefail
          sign() {
            for attempt in 1 2 3 4 5; do
              if cosign sign-blob --bundle "$1.sigstore.json" "$1"; then return 0; fi
              if [ "$attempt" -lt 5 ]; then
                delay=$(( attempt * 15 ))
                echo "::warning::cosign sign-blob $1 attempt ${attempt}/5 failed; retrying in ${delay}s"
                sleep "${delay}"
              fi
            done
            echo "::error::cosign sign-blob failed for $1 after 5 attempts"
            return 1
          }
          for f in *; do sign "$f"; done
          ls -l

      # Verify with the command the header hands to users. Also check that each bundle is a Sigstore
      # bundle (the format `.sigstore.json` names), not cosign's older bundle layout.
      - name: Verify every bundle we just produced
        working-directory: assets
        run: |
          set -euo pipefail
          for b in *.sigstore.json; do
            f="${b%.sigstore.json}"
            python3 -c 'import json,sys; m=json.load(open(sys.argv[1])).get("mediaType",""); sys.exit(0 if m.startswith("application/vnd.dev.sigstore.bundle") else "not a Sigstore bundle: "+sys.argv[1])' "$b"
            cosign verify-blob "$f" --bundle "$b" \
              --certificate-identity-regexp '^https://github.com/norviq-dev/norviq/.github/workflows/release.yml@.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          echo "every release asset verifies against the documented cosign command"

      - name: Keep the signed set for the GitHub Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-assets
          path: assets/
          if-no-files-found: error
          retention-days: 7
          overwrite: true      # a re-run of this job replaces the earlier attempt's set

  github-release:
    needs: [version, release-sign]
    if: ${{ !cancelled() && needs.release-sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the GitHub Release for the tag and upload its assets
    steps:
      # First-party action, same-run download: it is given no token input and uses the runner's
      # artifact token. The contents: write token reaches only the gh step below.
      - name: Collect the signed assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-release-assets
          path: assets

      # Uses the gh CLI that ships on the runner, so no extra action.
      #
      # Immutable releases: once a Release is published with that setting on, assets can no longer be
      # added. So a new Release is created as a DRAFT, the assets go on, and only then is it
      # published. Every draft this workflow creates carries a fixed marker line (an HTML comment,
      # invisible on the Release page) in its notes. If a Release already exists: a draft with the
      # marker was made by an earlier attempt of this workflow, so it gets the assets and is
      # published; a draft without the marker was made by hand, so it gets the assets, stays
      # unpublished, and the job warns (annotation + job summary); a published, mutable one gets the
      # assets; a published, immutable one cannot take them, so the job fails with an explanation
      # instead of a bare API error. Existing notes are left alone in every case.
      - name: Attach the signed assets to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l assets
          # Only a real "release not found" takes the create path. Any other failure of the view
          # (API or auth error, a gh too old to know a field) stops the job with gh's own message.
          view_err="${RUNNER_TEMP}/release-view.err"
          # Fixed marker written into the notes of every draft this workflow creates.
          marker='<!-- norviq-release-workflow: draft created by release.yml -->'
          if state="$(gh release view "$TAG" --json isDraft,isImmutable --jq '"\(.isDraft) \(.isImmutable)"' 2>"$view_err")"; then
            read -r is_draft is_immutable <<< "$state"
            if [ "$is_draft" != "true" ] && [ "$is_immutable" = "true" ]; then
              echo "::error::The GitHub Release for ${TAG} was already published and is immutable, so the signed assets cannot be added. See step 2b (GitHub Release) of 'Cutting the release' in docs/engineering/release-runbook.md."
              exit 1
            fi
            gh release upload "$TAG" assets/* --clobber
            if [ "$is_draft" = "true" ]; then
              body="$(gh release view "$TAG" --json body --jq .body)"
              if grep -qF -- "$marker" <<< "$body"; then
                echo "::notice::The Release for ${TAG} is a draft an earlier attempt of this workflow created; assets attached, publishing it now."
                gh release edit "$TAG" --draft=false
              else
                # A hand-made draft is the documented flow for a release with security fixes (runbook 1c,
                # 2b): leave it unpublished for the maintainer, but say so loudly instead of failing.
                msg="The Release for ${TAG} is a draft that was made by hand (its notes lack the workflow's marker line). The signed assets are attached; it is NOT published yet: review it and publish it by hand."
                echo "::warning::${msg}"
                echo "### Release ${TAG} is an unpublished draft" >> "$GITHUB_STEP_SUMMARY"
                echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          elif grep -qi 'release not found' "$view_err"; then
            cat > "${RUNNER_TEMP}/notes.md" <<EOF
          ${marker}
          Norviq ${VERSION}. Changes are listed in [CHANGELOG.md](https://github.com/${GH_REPO}/blob/${TAG}/CHANGELOG.md).

          Each file this workflow attached below has a keyless Sigstore bundle (\`<file>.sigstore.json\`). Verify one with:

          \`\`\`
          cosign verify-blob <file> --bundle <file>.sigstore.json \\
            --certificate-identity-regexp '^https://github.com/norviq-dev/norviq/.github/workflows/release.yml@.*' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
            gh release create "$TAG" assets/* --draft --verify-tag --title "Norviq ${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
            gh release edit "$TAG" --draft=false
          else
            echo "::error::Could not read the GitHub Release for ${TAG}; gh said:"
            cat "$view_err"
            exit 1
          fi
