apiVersion: norviq.io/v1alpha1
kind: NrvqPolicy
metadata:
  name: analyst-moderate
  namespace: analytics
spec:
  target:
    agentClass: data-analyst
  # enforcementMode IS read by the engine, for the value "audit" (evaluator._apply_policy_mode). This
  # comment used to say the evaluator does NOT read it, which pushed operators to the namespace-wide
  # audit posture — a far bigger hammer — to trial a single policy. Set `enforcementMode: audit` here to
  # trial THIS policy: it still evaluates and still reports, but its block/escalate is softened to audit
  # with the rule_id prefixed `policy_audit_would_block:`, so you see what it would have stopped.
  # "block" and "escalate" behave the same — only "audit" is special-cased.
  # (A trust freeze, engine-health and rate-limit verdicts stay hard in every mode.)
  enforcementMode: block
  preset: moderate
  # Canonical rule_ids enforced by the bundled comprehensive policy (informational).
  rules:
    - llm01_prompt_injection
    - llm06_excessive_agency
    - deny_sql_injection
  priority: 150
