# Gitleaks config — extends the default rules, adds a scoped allowlist.
# Scans are run over the DIFF / PR-range (see .github/workflows/security.yml + .pre-commit-config.yaml),
# NOT full git history — history contains a rotated JWT + past secrets we deliberately do not re-alarm on.
[extend]
useDefault = true

[allowlist]
description = "Norviq allowlist — test fixtures, attack payloads, and example placeholders are not real secrets."
paths = [
  '''tests/.*''',
  '''norviq/redteam/.*''',
  '''.*\.md$''',                 # docs/specs use example tokens
  '''specs/prompts/.*''',
  '''scripts/live-pentest/.*''',        # local-kind E2E / release-exit overlays: dummy secretKeys for throwaway clusters
  # Rego test fixtures: fake api_key/PII/token payloads that EXERCISE the detectors. Widened from
  # `webhook/presets/.*_test\.rego$` to any `_test.rego`, because comprehensive_test.rego lives at the
  # repo ROOT and was not covered — its bare-credential cases (a sample AWS key id, GitHub/Slack tokens,
  # the jwt.io example JWT) are exactly the shapes strict.rego's DL-001b rule must match, so they trip
  # gitleaks by construction. Sanitising the fixtures instead would defeat the tests: a payload that no
  # longer looks like a credential no longer proves the detector fires on one.
  # `_test.rego` is not a loose glob — it is the suffix `opa test` itself requires, so this can only
  # ever match a test file.
  '''.*_test\.rego$''',
  # UI unit tests: the analog of the `tests/.*` entry above, for the half of the test tree that lives
  # under ui/. These files build syntactically-valid dev JWTs (header.payload.signature) so that
  # getToken()/tokenSubject() take their real code paths instead of the unauthenticated branch — e.g.
  # Header.test.tsx's `eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiJ9.sig`, whose signature segment is the
  # literal string "sig". A structurally-invalid stand-in would not exercise the parser, which is the
  # whole point of the fixture. Deliberately does NOT cover ui/tests/e2e/*.spec.ts: those specs talk to
  # a live cluster and read real credentials from the environment, so they are the files where a
  # pasted-in secret would actually matter and must keep alarming.
  '''ui/.*\.test\.tsx?$''',
]
# Common non-secret placeholders used in dev/kind (e.g. norviq-redis-password).
regexes = [
  '''norviq-[a-z-]+-password''',
  '''change-?me''',
  '''example\.com''',
]
