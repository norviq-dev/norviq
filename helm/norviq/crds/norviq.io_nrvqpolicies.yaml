apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nrvqpolicies.norviq.io
  labels:
    app.kubernetes.io/name: norviq
spec:
  group: norviq.io
  names:
    kind: NrvqPolicy
    listKind: NrvqPolicyList
    plural: nrvqpolicies
    singular: nrvqpolicy
    shortNames:
      - np
      - nrvqp
    categories:
      - norviq
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - target
                - enforcementMode
              properties:
                target:
                  type: object
                  description: Where this policy applies
                  x-kubernetes-validations:
                    - rule: "has(self.agentClass) || has(self.namespace) || (has(self.kind) && has(self.name))"
                      message: "target must set agentClass, namespace, or both kind and name"
                  properties:
                    agentClass:
                      type: string
                      minLength: 1
                      maxLength: 63
                      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                      description: Apply to agents with this class label
                    namespace:
                      type: string
                      maxLength: 63
                      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                      description: Apply to all agents in this namespace
                    kind:
                      type: string
                      enum: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
                    name:
                      type: string
                      maxLength: 63
                      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                enforcementMode:
                  type: string
                  enum: ["block", "audit", "escalate"]
                  default: block
                  description: >-
                    How THIS policy's own verdicts are applied. "audit" is read by the engine
                    (evaluator._apply_policy_mode): when this policy wins, its block/escalate is softened
                    to audit and the rule_id is prefixed policy_audit_would_block: — so the policy reports
                    what it WOULD have done without stopping the call. That makes it the right way to
                    trial one policy, as opposed to the namespace-wide monitor posture. Exemptions still
                    hard-block: an admin trust freeze, engine-health and rate-limit verdicts are not
                    softened. "block" and "escalate" behave identically here — only "audit" is special-
                    cased, so setting "escalate" does NOT turn a policy's blocks into escalations.
                preset:
                  type: string
                  enum: ["strict", "moderate", "permissive"]
                rules:
                  type: array
                  description: >-
                    ADVISORY ONLY — accepted and stored, read by nothing. The controller forwards it and
                    the API's PolicyCreate accepts it, but no evaluation path consumes it: the rules that
                    actually run are the ones in the policy's rego (spec.rego or spec.preset). It is
                    useful as documentation of intent next to the rego, and is retained for that; do not
                    expect listing a rule_id here to enforce it.
                  maxItems: 256
                  items:
                    type: string
                    maxLength: 128
                    pattern: ^[a-zA-Z0-9_.\/-]+$
                rego:
                  type: string
                  maxLength: 65536
                  description: Custom Rego policy source (overrides preset and rules)
                priority:
                  type: integer
                  description: Policy priority. Namespace users limited to 0-499.
                  default: 100
                  minimum: 0
                  maximum: 499
                clusterPriority:
                  type: integer
                  description: Admin-only priority override for control-plane policies.
                  minimum: 500
                  maximum: 1000
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Active", "Error"]
                message:
                  type: string
                lastApplied:
                  type: string
                  format: date-time
                matchingWorkloads:
                  type: integer
                  description: >-
                    RESERVED, not populated. The controller does not compute this; it is retained only
                    so an existing consumer does not break. Do not treat an absent value as zero.
                blockCount24h:
                  type: integer
                  description: >-
                    RESERVED, not populated. This was previously written as a hard-coded 0 on every
                    status update and surfaced as a "Blocks-24h" printer column, so kubectl reported
                    zero blocks for policies that were blocking. For real block counts use the
                    console's audit view or GET /api/v1/audit/stats.
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.target.agentClass
          description: Agent class this policy targets
        - name: Mode
          type: string
          jsonPath: .spec.enforcementMode
          description: Enforcement mode
        - name: Phase
          type: string
          jsonPath: .status.phase
          description: Policy status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
