apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nrvqclasses.norviq.io
  labels:
    app.kubernetes.io/name: norviq
spec:
  group: norviq.io
  names:
    kind: NrvqClass
    listKind: NrvqClassList
    plural: nrvqclasses
    singular: nrvqclass
    shortNames:
      - nc
      - nrvqc
    categories:
      - norviq
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: >-
                ADVISORY. The controller consumes NO field of this spec — it reads only the object's EXISTENCE
                (an NrvqPolicy whose agentClass has no NrvqClass is rejected) and derives status.policyCount by
                counting NrvqPolicy targets. maxCallsPerMinute, trust settings and every other field here are
                stored and never read; the real rate limit is config.rateLimit* in values.yaml and the real trust
                settings are the trust.* helm values. Two kubectl columns that reported uncomputed status fields
                were removed for the same reason.
              required:
                - description
                - allowedTools
              properties:
                description:
                  type: string
                  maxLength: 256
                allowedTools:
                  type: array
                  maxItems: 256
                  items:
                    type: string
                    maxLength: 128
                    pattern: ^[a-zA-Z0-9_.\/-]+$
                blockedTools:
                  type: array
                  maxItems: 256
                  items:
                    type: string
                    maxLength: 128
                    pattern: ^[a-zA-Z0-9_.\/-]+$
                maxCallsPerMinute:
                  type: integer
                  default: 60
                  minimum: 1
                  maximum: 10000
                initialTrustScore:
                  type: number
                  default: 0.8
                  minimum: 0
                  maximum: 1.0
                trustThreshold:
                  type: number
                  default: 0.4
                  minimum: 0
                  maximum: 1.0
                labelSelector:
                  type: string
                  maxLength: 256
                  default: norviq.io/agent-class
            status:
              type: object
              properties:
                agentCount:
                  type: integer
                  description: >-
                    RESERVED, not populated. The controller does not compute this. It was previously written as a hard-coded zero on every reconcile and surfaced in a kubectl column, so it reported a number that could not be true. Real values come from the console and the REST API.
                averageTrustScore:
                  type: number
                  description: >-
                    RESERVED, not populated. The controller does not compute this. It was previously written as a hard-coded zero on every reconcile and surfaced in a kubectl column, so it reported a number that could not be true. Real values come from the console and the REST API.
                policyCount:
                  type: integer
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Policies
          type: integer
          jsonPath: .status.policyCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
