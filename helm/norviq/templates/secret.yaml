{{- $secretName := "norviq-secrets" }}
{{/* Never ship literal shipped-default secrets. `lookup` only sees a LIVE cluster (it returns
     an empty dict during `helm template` / `--dry-run`, with no error) -- computed once, reused below
     for both the JWT secret and the default admin password so an upgrade never re-randomizes either
     one (that would invalidate every live session/JWT, and every fleet spoke trusting this hub). Only
     `helm install`/`upgrade` against the real cluster benefit from the persisted value; offline
     rendering always falls back to a freshly generated value -- expected and harmless for validation. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}

{{- /* DATASTORE CREDENTIALS — generated on first install, reused forever after.

       The chart used to ship literal defaults (`norviq-pg-password` / `norviq-redis-password`) and the
       requireStrongSecret gate only rejected an EMPTY value, so a stock install wired a credential
       published in this repo into NRVQ_PG_URL / NRVQ_REDIS_URL. Making that gate reject the defaults too
       closed the hole but broke `helm install` out of the box — not the convention for a chart that
       bundles its own datastores. So instead we do what Bitnami's charts (and this very file, for the JWT
       secret and the admin password) already do: MANAGE the credential.

       Resolution order per store — first match wins:
         1. an explicit value (`--set postgresql.password=...`, a sealed secret, values-prod) — always wins;
         2. the value already in this Secret — so an upgrade NEVER rotates it (rotating would strand the
            live database: postgres only honours POSTGRES_PASSWORD when initdb runs on an EMPTY data dir,
            and redis would start demanding a password the API doesn't have);
         3. the historical literal, but ONLY when this Secret already exists WITHOUT our key — i.e. an
            upgrade from a release that predates this block, whose PVC was initialised with that literal.
            Rotating there would lock the API out of its own data, so continuity wins; NOTES.txt tells the
            operator to rotate deliberately. A FRESH install never reaches this branch;
         4. otherwise (no Secret at all = first install) a strong random value.

       Every consumer reads the value from THIS Secret (postgres/redis StatefulSets via secretKeyRef, the
       URLs below), so the generated value is consistent across the release — a template helper calling
       randAlphaNum per call site would mint a different password in each one. */}}
{{- /* BRING-YOUR-OWN datastores. `enabled: false` deploys nothing, so Norviq needs to be told where
       the external store actually is: without a host we would emit the bundled service name and the API
       would dial a Service that does not exist. Fail loudly instead of shipping that dead address.
       `existingSecret` is the production credential path — the operator keeps the full URL in their own
       Secret and the pods read it directly (see api/engine/webhook deployments), so no credential passes
       through values, `--set` or this chart's Secret, and nothing is generated for that store. */}}
{{- $pgExternal := not .Values.postgresql.enabled }}
{{- $redisExternal := not .Values.redis.enabled }}
{{- $pgByoSecret := ne (.Values.postgresql.existingSecret | default "") "" }}
{{- $redisByoSecret := ne (.Values.redis.existingSecret | default "") "" }}
{{- if and $pgExternal (not $pgByoSecret) (eq (.Values.postgresql.host | default "") "") }}
{{- fail "postgresql.enabled=false (external database) but neither postgresql.host nor postgresql.existingSecret is set — Norviq has no address to connect to. Set --set postgresql.host=<your-db-host>, or point postgresql.existingSecret at a Secret holding the full URL." }}
{{- end }}
{{- if and $redisExternal (not $redisByoSecret) (eq (.Values.redis.host | default "") "") }}
{{- fail "redis.enabled=false (external cache) but neither redis.host nor redis.existingSecret is set — Norviq has no address to connect to. Set --set redis.host=<your-redis-host>, or point redis.existingSecret at a Secret holding the full URL." }}
{{- end }}

{{- $legacyPgPassword := "norviq-pg-password" }}
{{- $legacyRedisPassword := "norviq-redis-password" }}

{{- $pgPassword := .Values.postgresql.password | default "" }}
{{- if eq $pgPassword "" }}
  {{- if and $existing $existing.data (hasKey $existing.data "NRVQ_PG_PASSWORD") }}
    {{- $pgPassword = index $existing.data "NRVQ_PG_PASSWORD" | b64dec }}
  {{- else if $existing }}
    {{- $pgPassword = $legacyPgPassword }}
  {{- else }}
    {{- $pgPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}

{{- $redisPassword := .Values.redis.password | default "" }}
{{- if eq $redisPassword "" }}
  {{- if and $existing $existing.data (hasKey $existing.data "NRVQ_REDIS_PASSWORD") }}
    {{- $redisPassword = index $existing.data "NRVQ_REDIS_PASSWORD" | b64dec }}
  {{- else if $existing }}
    {{- $redisPassword = $legacyRedisPassword }}
  {{- else }}
    {{- $redisPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}

{{- $apiSecretKey := .Values.api.secretKey }}
{{- if eq $apiSecretKey "change-me-in-production" }}
  {{/* Self-generate a strong random JWT secret (randAlphaNum, well above the require_strong_secret
       >=16-char floor) on first install. An explicit non-default api.secretKey always wins verbatim.
       Reuse the value already deployed on an upgrade -- UNLESS that deployed value is ITSELF still the
       weak literal default (a release installed without this auto-generation): perpetuating a known
       weak secret across an upgrade would defeat the purpose, so that case generates a
       fresh strong secret instead (this does rotate/invalidate live sessions for that one upgrade --
       correct, since anyone could already forge tokens against the well-known default). */}}
  {{- $reuse := "" }}
  {{- if and $existing $existing.data (hasKey $existing.data "NRVQ_API_SECRET_KEY") }}
    {{- $reuse = index $existing.data "NRVQ_API_SECRET_KEY" | b64dec }}
  {{- end }}
  {{- if and $reuse (ne $reuse "change-me-in-production") (ge (len $reuse) 16) }}
    {{- $apiSecretKey = $reuse }}
  {{- else }}
    {{- $apiSecretKey = randAlphaNum 48 }}
  {{- end }}
{{- end }}

{{- $adminPassword := .Values.auth.adminPassword | default "norviq" }}
{{- if eq $adminPassword "norviq" }}
  {{/* Same treatment for the seeded default-admin password: with requireStrongSecret=true (now the
       chart default) the API refuses to boot while the admin is still on the literal shipped default,
       so leaving this un-generated would brick a stock install. The seeded admin ALWAYS has
       must_change=true (auth_login.ensure_default_admin), so a random first password is strictly safer
       than "norviq" for everyone and costs nothing at first login -- retrieve it with:
       kubectl get secret norviq-secrets -n {{ .Release.Namespace }} -o jsonpath='{.data.NRVQ_AUTH_ADMIN_PASSWORD}' | base64 -d
       An explicit non-default auth.adminPassword always wins verbatim; same reuse-unless-still-weak
       rule as the JWT secret above applies across upgrades. */}}
  {{- $reuse := "" }}
  {{- if and $existing $existing.data (hasKey $existing.data "NRVQ_AUTH_ADMIN_PASSWORD") }}
    {{- $reuse = index $existing.data "NRVQ_AUTH_ADMIN_PASSWORD" | b64dec }}
  {{- end }}
  {{- if and $reuse (ne $reuse "norviq") }}
    {{- $adminPassword = $reuse }}
  {{- else }}
    {{- $adminPassword = randAlphaNum 20 }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
type: Opaque
stringData:
  NRVQ_API_SECRET_KEY: {{ $apiSecretKey | quote }}
  {{- if .Values.auth.enabled }}
  # Seed credentials for the default local admin. The plaintext seed is hashed (bcrypt) at first boot;
  # only the hash is persisted in the API DB. The password is auto-generated (see above) unless you set
  # auth.adminPassword explicitly; either way you are forced to change it on first login (must_change=true).
  NRVQ_AUTH_ADMIN_USERNAME: {{ .Values.auth.adminUsername | default "admin" | quote }}
  NRVQ_AUTH_ADMIN_PASSWORD: {{ $adminPassword | quote }}
  {{- end }}
  {{/* An explicit host always wins (external/BYO store); otherwise the bundled service — the HA
       read-write service when HA is on, else the single-node one. */}}
  {{- $redisHost := .Values.redis.host | default (ternary .Values.redis.ha.serviceName "norviq-redis" .Values.redis.ha.enabled) }}
  {{- $pgHost := .Values.postgresql.host | default (ternary .Values.postgresql.ha.serviceName "norviq-postgresql" .Values.postgresql.ha.enabled) }}
  {{/* The datastore passwords are also published as their own keys so the postgres/redis StatefulSets
       can consume the SAME value via secretKeyRef (they used to interpolate .Values directly, which is
       why the credential could not be generated before). */}}
  {{- if not $pgByoSecret }}
  NRVQ_PG_PASSWORD: {{ $pgPassword | quote }}
  NRVQ_PG_URL: "postgresql://{{ .Values.postgresql.username }}:{{ $pgPassword }}@{{ $pgHost }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}"
  {{- end }}
  {{- if not $redisByoSecret }}
  NRVQ_REDIS_PASSWORD: {{ $redisPassword | quote }}
  NRVQ_REDIS_URL: "redis://:{{ $redisPassword }}@{{ $redisHost }}:{{ .Values.redis.port }}"
  {{- end }}
  {{- if .Values.webhook.oidc.enabled }}
  # Client secret for the controller's OIDC client-credentials grant (Keycloak norviq-webhook client).
  NRVQ_OIDC_CLIENT_SECRET: {{ .Values.webhook.oidc.clientSecret | default "" | quote }}
  {{- end }}
  {{- if .Values.fleet.enabled }}
  # Client secret for the spoke relay's OIDC client-credentials grant to the fleet hub.
  NRVQ_FLEET_OIDC_CLIENT_SECRET: {{ .Values.fleet.oidc.clientSecret | default "" | quote }}
  {{- end }}
  {{- if .Values.fleet.hub.enabled }}
  # The fleet bundle signing PRIVATE key (hub-only trust root; distinct from NRVQ_API_SECRET_KEY).
  NRVQ_FLEET_SIGNING_KEY: {{ .Values.fleet.hub.signingKey | default "" | quote }}
  {{- end }}
