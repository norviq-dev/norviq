{{- if .Values.config.internalTls.enabled }}
# Zero-touch internal TLS bootstrap. A pre-install/pre-upgrade Helm hook Job mints (once, idempotently):
#   1. a self-signed Norviq internal CA           -> secret norviq-internal-ca   (ca.crt, ca.key)
#   2. a CA-signed serving cert for norviq-api    -> secret norviq-api-tls       (tls.crt, tls.key, ca.crt)
# The API pod's TLS terminator serves (2); every cross-pod client (controller, sidecar, console) trusts
# the CA from (1); the injector signs per-namespace client certs with the CA for sidecar mTLS. No
# operator action, no cert-manager, no manual CSRs — `helm install` yields encrypted control-plane
# traffic out of the box. Idempotent: existing secrets are REUSED so the CA identity is stable across
# upgrades (a regenerated CA would break every already-issued cert until every pod restarts).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: norviq-internal-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: norviq-internal-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: norviq-internal-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: norviq-internal-tls
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: norviq-internal-tls
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: norviq-internal-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: norviq-internal-tls
    spec:
      serviceAccountName: norviq-internal-tls
      {{- /* Hook Jobs pull the SAME images.bootstrap image from the SAME images.registry as every
             Deployment, so they need the same pull auth. Without it a private-registry install
             ImagePullBackOffs here while every other pod starts: the pre-install cert and TLS
             hooks then block `helm install --wait` on a deadline, and the pre-delete finalizer
             cleanup silently fails to release norviq.io/policy-protection, stranding NrvqPolicy
             CRs in Terminating on uninstall. */}}
      {{- include "norviq.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      securityContext:
        # The bootstrap image ships openssl (and curl, which replaces kubectl here), so this hook
        # no longer `apk add`s at runtime and no longer needs root.
        # by OpenShift's default restricted-v2 SCC, which killed `helm install` at this very hook.
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        # Pinned on vanilla/AKS/EKS/GKE, where nothing assigns a UID for you. OMITTED under OpenShift,
        # which allocates a per-namespace UID range (~1000650000+) and rejects any pinned value outside
        # it — the image is built to run under an arbitrary UID in GID 0.
        runAsUser: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tls-bootstrap
          image: "{{ include "norviq.image" (dict "root" $ "component" .Values.images.bootstrap) }}"
          # Bounded so a pre-install bootstrap hook cannot compete for CPU/memory with the
          # enforcement pods it runs ahead of. Root is still required here for the apk/openssl
          # bootstrap (narrowly exempted); being unbounded was not.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              NS={{ .Release.Namespace }}
              CA_SECRET=norviq-internal-ca
              API_SECRET=norviq-api-tls
              SVC=norviq-api
              TMP="$(mktemp -d)"
              # curl + the pod's service-account token instead of kubectl — see Dockerfile.bootstrap
              # for why kubectl was removed (vendored golang.org/x/net CVEs failing the trivy gate).
              API=https://kubernetes.default.svc
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN="$(cat ${SA}/token)"
              k() {
                _m="$1"; _p="$2"; _b="${3:-}"
                if [ -n "$_b" ]; then
                  curl -sS --fail-with-body --cacert "${SA}/ca.crt" -H "Authorization: Bearer ${TOKEN}" \
                    -H "Content-Type: application/json" -X "$_m" --data-binary "$_b" "${API}${_p}"
                else
                  curl -sS --fail-with-body --cacert "${SA}/ca.crt" -H "Authorization: Bearer ${TOKEN}" \
                    -X "$_m" "${API}${_p}"
                fi
              }
              # read one base64 value out of a Secret JSON body without a JSON parser
              val() { sed -n "s/.*\"$2\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" "$1" | head -1; }
              mkgeneric() {  # mkgeneric <name> <k1> <f1> [<k2> <f2>] [<k3> <f3>]
                _n="$1"; shift; _d=""
                while [ $# -ge 2 ]; do
                  _v="$(base64 < "$2" | tr -d '\n')"
                  [ -n "$_d" ] && _d="${_d},"
                  _d="${_d}\"$1\":\"${_v}\""
                  shift 2
                done
                printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","namespace":"%s"},"data":{%s}}' \
                  "${_n}" "${NS}" "${_d}" > "${TMP}/mk.json"
                k POST "/api/v1/namespaces/${NS}/secrets" "@${TMP}/mk.json" >/dev/null
              }

              # ---- 1. CA (idempotent: reuse if present) ----
              if k GET "/api/v1/namespaces/${NS}/secrets/${CA_SECRET}" > "${TMP}/ca.json" 2>/dev/null; then
                echo "reusing existing internal CA ${CA_SECRET}"
                val "${TMP}/ca.json" "ca.crt" | base64 -d > "${TMP}/ca.crt"
                val "${TMP}/ca.json" "ca.key" | base64 -d > "${TMP}/ca.key"
              else
                echo "generating Norviq internal CA"
                openssl req -x509 -newkey rsa:2048 -nodes -keyout "${TMP}/ca.key" -out "${TMP}/ca.crt" \
                  -days 3650 -subj "/CN=Norviq Internal CA/O=norviq" \
                  -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
                mkgeneric "${CA_SECRET}" ca.crt "${TMP}/ca.crt" ca.key "${TMP}/ca.key"
              fi

              # ---- 2. API serving cert (idempotent) signed by the CA ----
              if k GET "/api/v1/namespaces/${NS}/secrets/${API_SECRET}" >/dev/null 2>&1; then
                echo "reusing existing API serving cert ${API_SECRET}"
              else
                echo "issuing API serving cert for ${SVC}"
                printf 'subjectAltName=DNS:%s,DNS:%s.%s,DNS:%s.%s.svc,DNS:%s.%s.svc.cluster.local,DNS:localhost,IP:127.0.0.1\n' \
                  "${SVC}" "${SVC}" "${NS}" "${SVC}" "${NS}" "${SVC}" "${NS}" > "${TMP}/san.cnf"
                openssl req -newkey rsa:2048 -nodes -keyout "${TMP}/tls.key" -out "${TMP}/tls.csr" \
                  -subj "/CN=${SVC}.${NS}.svc/O=norviq"
                openssl x509 -req -in "${TMP}/tls.csr" -CA "${TMP}/ca.crt" -CAkey "${TMP}/ca.key" \
                  -CAcreateserial -days 3650 -extfile "${TMP}/san.cnf" -out "${TMP}/tls.crt"
                mkgeneric "${API_SECRET}" tls.crt "${TMP}/tls.crt" tls.key "${TMP}/tls.key" ca.crt "${TMP}/ca.crt"
              fi
              echo "internal-tls bootstrap done"
{{- end }}
