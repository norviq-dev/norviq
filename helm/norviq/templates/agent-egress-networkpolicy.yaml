{{- if .Values.agentEgressPolicy.enabled }}
{{- if not (has .Values.agentEgressPolicy.engine (list "networkpolicy" "cilium")) }}
{{-   fail (printf "agentEgressPolicy.engine must be \"networkpolicy\" or \"cilium\", got %q." .Values.agentEgressPolicy.engine) }}
{{- end }}
{{- end }}
{{- if and .Values.agentEgressPolicy.enabled (ne .Values.agentEgressPolicy.engine "cilium") }}
{{- /* Defense-in-depth (engine=networkpolicy): default-deny egress for agent-workload namespaces,
       so a pod that ignores the cooperative sidecar PEP still cannot reach anything except the norviq
       control plane, DNS, and the operator-approved tool CIDRs. Requires a NetworkPolicy-enforcing CNI
       (Calico/Cilium). For hostname (FQDN) allowlisting, set agentEgressPolicy.engine=cilium. */}}
{{- $root := . }}
{{- $ep := .Values.agentEgressPolicy }}
{{- $nsList := $ep.namespaces }}
{{- if not $nsList }}{{- $nsList = .Values.policyQuotaNamespaces }}{{- end }}
{{- if not $nsList }}
{{-   fail "agentEgressPolicy.enabled=true but no namespaces to lock down — set agentEgressPolicy.namespaces or policyQuotaNamespaces (empty would silently protect nothing)." }}
{{- end }}
{{- range $ns := $nsList }}
{{-   if eq $ns $root.Release.Namespace }}{{- fail (printf "agentEgressPolicy must not target the norviq control-plane namespace %q — list only tenant/agent namespaces." $ns) }}{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: norviq-agent-egress-lockdown
  namespace: {{ $ns }}
  labels:
    {{- include "norviq.labels" $root | nindent 4 }}
spec:
  # All pods in the tenant namespace. The injected sidecar shares each agent pod, so its egress to the
  # norviq API is covered by the control-plane rule below; the agent's own tool egress is the allowlist.
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    {{- if $ep.allowDNS }}
    # DNS resolution (kube-dns / CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # Norviq control plane: the sidecar (proxy mode) calls the norviq API for every decision.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
          podSelector:
            matchLabels:
              app: norviq-api
    {{- if $ep.embeddedDatastores }}
    {{- /* embedded sidecar mode: the sidecar runs its own engine off the cluster datastores, so it
           needs egress to Postgres and Redis directly. The pod labels DIFFER per datastore shape, and
           a podSelector that matches nothing grants nothing — under a default-deny egress policy that
           silently leaves the sidecar unable to reach its own datastores. So each shape names the
           labels that actually exist in it:

             bundled  the in-chart StatefulSets, labelled `app: norviq-{postgresql,redis}`
             HA       operator-created pods — CNPG stamps `cnpg.io/cluster`, the Spotahome operator
                      stamps its own component/instance pair. Neither carries `app: norviq-*`.
             external not a pod in this cluster at all; no selector can ever match it, which is why
                      the guard below requires an explicit allowedCIDRs entry instead. */}}
    - to:
        {{- if $root.Values.postgresql.ha.enabled }}
        # CloudNativePG. All pods of the cluster, not just the primary: the RW Service follows a
        # failover, so pinning `role: primary` would break the sidecar the first time it moved.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
          podSelector:
            matchLabels:
              cnpg.io/cluster: norviq-postgresql-ha
        {{- else if $root.Values.postgresql.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
          podSelector:
            matchLabels:
              app: norviq-postgresql
        {{- end }}
        {{- if $root.Values.redis.ha.enabled }}
        # Spotahome RedisFailover. Again every redis pod of the failover, since the master moves —
        # mirrors the master Service's selector minus `redisfailovers-role`.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
              redisfailovers.databases.spotahome.com/name: norviq-redis-ha
        {{- else if $root.Values.redis.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
          podSelector:
            matchLabels:
              app: norviq-redis
        {{- end }}
    {{- $external := list }}
    {{- if not (or $root.Values.postgresql.enabled $root.Values.postgresql.ha.enabled) }}{{- $external = append $external "postgresql" }}{{- end }}
    {{- if not (or $root.Values.redis.enabled $root.Values.redis.ha.enabled) }}{{- $external = append $external "redis" }}{{- end }}
    {{- if and $external (not $ep.allowedCIDRs) }}
    {{-   fail (printf "agentEgressPolicy.embeddedDatastores=true but %s external to this cluster, so no podSelector can reach that. Under default-deny egress the embedded sidecar would fail to connect. Add the datastore's CIDR to agentEgressPolicy.allowedCIDRs." (ternary (printf "%s are" (join " and " $external)) (printf "%s is" (join " and " $external)) (gt (len $external) 1))) }}
    {{- end }}
    {{- end }}
    {{- range $cidr := $ep.allowedCIDRs }}
    # Operator-approved tool endpoint.
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      {{- with $ep.allowedPorts }}
      ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
