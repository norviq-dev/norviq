{{- if and .Values.redis.enabled .Values.redis.ha.enabled }}
{{- /* HA store via the Spotahome redis-operator (Sentinel-managed failover) — multi-node prod. It runs
       Valkey (BSD-3-Clause), which speaks the Redis protocol, ships `redis-server`/`redis-cli` as
       symlinks to its own binaries, and runs the operator's replication, readiness and sentinel
       scripts unchanged. The keys keep their `redis` names.
       GATED, default off, NOT live-validated on the single-node dev cluster. REQUIRES the
       redis-operator (RedisFailover CRD) installed first. Sentinel promotes a replica on master
       loss; the API connects through the failover service (redis.ha.serviceName). If you use a
       different Redis HA stack (Bitnami chart, AWS MemoryDB, etc.) swap this template + serviceName. */ -}}
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  {{- /* Renamed from 0.2.5's norviq-redis-ha on purpose: see norviq.redisFailoverName. */}}
  name: {{ include "norviq.redisFailoverName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
spec:
  {{- /* customConfig sets `requirepass` INSIDE redis, but the operator only learns the password
         from auth.secretPath — and that is what makes it inject REDIS_PASSWORD into the redis and
         sentinel pods. Without it the operator's own readiness script runs `redis-cli info
         replication` unauthenticated, gets NOAUTH, prints "unespected", and the pods never become
         Ready even though replication is perfectly healthy. The sentinels also cannot authenticate
         to the master, so failover monitoring is degraded. Both halves are required: requirepass
         configures the server, secretPath tells the operator. */}}
  auth:
    secretPath: norviq-redis-ha-auth
  {{- /* redis.ha.image, NOT images.redis, so a later bump of the single store's engine never rolls
         into a running failover (values.yaml says why). The sentinels take the same image: left unset,
         the operator fills in its own default (redis:6.2.6-alpine in v1.2.4), unpinned and invisible
         to the release image gate. tests/helm/test_bundled_store_upgrade.py checks both. */}}
  {{- $haImage := include "norviq.thirdPartyImage" (dict "root" $ "image" (.Values.redis.ha.image | default "valkey/valkey:8.1-alpine")) }}
  sentinel:
    replicas: {{ .Values.redis.ha.replicas }}
    image: "{{ $haImage }}"
  redis:
    replicas: {{ .Values.redis.ha.replicas }}
    image: "{{ $haImage }}"
    {{- /* Same as the postgres HA path: the sentinel cluster takes its password through customConfig,
           which cannot reference the chart-generated value, so HA requires an explicit credential. The
           default single-node redis auto-generates. */}}
    {{- if eq (.Values.redis.password | default "") "" }}
    {{- fail "redis.ha.enabled=true requires an explicit redis.password (--set redis.password=... or a sealed secret) — the sentinel cluster takes its password through customConfig and cannot use the chart-generated one." }}
    {{- end }}
    customConfig:
      - "requirepass {{ .Values.redis.password }}"
      - "masterauth {{ .Values.redis.password }}"
    storage:
      persistentVolumeClaim:
        metadata:
          name: norviq-valkey-ha-data
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: {{ .Values.redis.storage }}
    resources:
      {{- toYaml .Values.redis.resources | nindent 6 }}
---
{{- /* THE MASTER SERVICE — the reason redis.ha never worked.

     redis.ha.serviceName named `norviq-redis-ha` and NRVQ_REDIS_URL pointed at it, but nothing
     created it: the Spotahome operator provisions a StatefulSet (`rfr-<name>`) and a sentinel
     Service (`rfs-<name>:26379`) and NO stable master endpoint, because its intended clients speak
     the Sentinel protocol to discover the current master. Norviq's client is
     `aioredis.from_url("redis://host:6379")` — a plain URL, no Sentinel support — so the whole HA
     path resolved to a hostname that did not exist.
     
     The operator does maintain a `redisfailovers-role` label on every redis pod, flipping it to
     `master` on the promoted one (verified live: 1 master / 2 slave, relabelled on failover). A
     Service selecting that label therefore tracks the master with no client changes and no Sentinel
     awareness — failover moves the label, the Service follows.
     
     Endpoints are ready-gated as normal, which is what we want: during the promotion window the
     Service briefly has no endpoints and the client's own retry covers it. Routing to a
     not-yet-ready master would be worse than a short refusal. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.ha.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: redis
    redisfailovers.databases.spotahome.com/name: {{ include "norviq.redisFailoverName" . }}
    redisfailovers-role: master
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: 6379
      protocol: TCP
---
apiVersion: v1
kind: Secret
metadata:
  name: norviq-redis-ha-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Key name is fixed by the operator's auth.secretPath contract.
  password: {{ .Values.redis.password | quote }}
{{- end }}
