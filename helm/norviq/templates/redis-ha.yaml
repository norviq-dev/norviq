{{- if and .Values.redis.enabled .Values.redis.ha.enabled }}
{{- /* HA Redis via the Spotahome redis-operator (Sentinel-managed failover) — multi-node prod.
       GATED, default off, NOT live-validated on the single-node dev cluster. REQUIRES the
       redis-operator (RedisFailover CRD) installed first. Sentinel promotes a replica on master
       loss; the API connects through the failover service (redis.ha.serviceName). If you use a
       different Redis HA stack (Bitnami chart, AWS MemoryDB, etc.) swap this template + serviceName. */ -}}
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: norviq-redis-ha
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
spec:
  sentinel:
    replicas: {{ .Values.redis.ha.replicas }}
  redis:
    replicas: {{ .Values.redis.ha.replicas }}
    image: "{{ include "norviq.thirdPartyImage" (dict "root" $ "image" (printf "%s:%s" .Values.images.redis.repository (.Values.images.redis.tag | toString))) }}"
    {{- /* Same as the postgres HA path: the sentinel cluster takes its password through customConfig,
           which cannot reference the chart-generated value, so HA requires an explicit credential. The
           default single-node redis auto-generates. */}}
    {{- if eq (.Values.redis.password | default "") "" }}
    {{- fail "redis.ha.enabled=true requires an explicit redis.password (--set redis.password=... or a sealed secret) — the sentinel cluster takes its password through customConfig and cannot use the chart-generated one." }}
    {{- end }}
    customConfig:
      - "requirepass {{ .Values.redis.password }}"
      - "masterauth {{ .Values.redis.password }}"
    storage:
      persistentVolumeClaim:
        metadata:
          name: norviq-redis-ha-data
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: {{ .Values.redis.storage }}
    resources:
      {{- toYaml .Values.redis.resources | nindent 6 }}
{{- end }}
