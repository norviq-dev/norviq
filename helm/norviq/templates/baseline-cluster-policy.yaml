{{- if .Values.baselineClusterPolicy.enabled }}
{{- if not .Values.policyQuotaNamespaces }}
{{- /*
  The baseline guard renders ONE NrvqPolicy per namespace in policyQuotaNamespaces. With that list
  empty, `enabled: true` would render ZERO baselines — every agent class would run with no baseline
  at all (no injection/threat detection, not even observing it), while NOTES.txt claims a baseline
  "installed by default". Two safe-looking defaults combining into a silent gap is refused here: fail
  the install loudly instead of shipping it.

  Note this guard is about the baseline EXISTING. It renders in `baselineClusterPolicy.enforcementMode`,
  which defaults to `block` from 0.2.6 (it was `audit` through 0.2.5): controls at `deny` refuse the
  call, controls at `monitor` record it. Rendering zero baselines loses both.
*/ -}}
{{- fail "\n\nbaselineClusterPolicy.enabled=true but policyQuotaNamespaces is EMPTY.\nNo baseline guard would be rendered, leaving every agent class with NO cluster baseline at all — no controls evaluating, not even in audit mode.\nEither:\n  - set policyQuotaNamespaces to your tenant namespaces (the baseline renders one per namespace), for example:\n      --set policyQuotaNamespaces='{default,chatbot-prod}'\n    or\n  - set baselineClusterPolicy.enabled=false to explicitly run WITHOUT a cluster baseline (not recommended).\n" }}
{{- end }}
{{- range $ns := .Values.policyQuotaNamespaces }}
apiVersion: norviq.io/v1alpha1
kind: NrvqPolicy
metadata:
  name: {{ $.Values.baselineClusterPolicy.name }}-{{ $ns }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "norviq.labels" $ | nindent 4 }}
spec:
  target:
    namespace: {{ $ns }}
  enforcementMode: {{ $.Values.baselineClusterPolicy.enforcementMode | default "block" }}
  preset: {{ $.Values.baselineClusterPolicy.preset }}
  clusterPriority: {{ $.Values.baselineClusterPolicy.clusterPriority }}
---
{{- end }}
{{- end }}
