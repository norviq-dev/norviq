{{- /* `dig` supplies a default for a MISSING path. A bare .Values.crdFinalizerCleanup.enabled
     hard-fails with "nil pointer evaluating interface {}.enabled" on `helm upgrade --reuse-values`
     from a release predating this value, because --reuse-values does not merge in values the newer
     chart added. That is the command operators reach for, and the failure is total: the upgrade
     aborts. Defaulting to TRUE (not false) matters — silently dropping this pre-delete hook would
     bring back the stuck-finalizer bug it exists to prevent, leaving an un-uninstallable release. */}}
{{- $cfc := .Values.crdFinalizerCleanup | default dict }}
{{- if ternary $cfc.enabled true (hasKey $cfc "enabled") }}
# `helm uninstall` cleanup. NrvqPolicy CRs carry the `norviq.io/policy-protection` finalizer, which only
# the controller (webhook Deployment) clears — and Helm deletes that controller as part of the same
# uninstall. Whichever goes first, the CRs are left in Terminating forever: the uninstall blocks until it
# times out ("resource NrvqPolicy/... still exists ... context deadline exceeded"), the release is left
# half-removed, and the operator has to hand-patch every CR before they can reinstall.
#
# This pre-delete hook releases the finalizers FIRST, while the API is still up, so the CRs delete
# cleanly and the uninstall completes. It is deliberately best-effort: `|| true` on the patch and a
# non-blocking exit, because a cleanup hook must never be the reason an uninstall fails — a stuck
# finalizer is recoverable by hand, an un-uninstallable release is worse.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: norviq-crd-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-crd-cleanup
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # Cluster-scoped list: policies may live in any tenant namespace, not just the release namespace.
  - apiGroups: ["norviq.io"]
    resources: ["nrvqpolicies", "nrvqclasses", "nrvqconfigs"]
    verbs: ["get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-crd-cleanup
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-crd-cleanup
subjects:
  - kind: ServiceAccount
    name: norviq-crd-cleanup
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-crd-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        {{- include "norviq.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: crd-cleanup
    spec:
      serviceAccountName: norviq-crd-cleanup
      restartPolicy: Never
      volumes:
        # kubectl writes a discovery/HTTP cache and would fail to start against a read-only rootfs.
        # tmpfs (never the node disk) for a throwaway cleanup Job — see the chart's rootfs contract test.
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      securityContext:
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        # Omitted under OpenShift, which allocates a per-namespace UID range and rejects any pinned
        # value outside it. This is a PRE-DELETE hook, so a rejection here would not fail the install —
        # it would fail the UNINSTALL, stranding the very CRD finalizers this Job exists to release.
        runAsUser: 65532
        {{- end }}
      containers:
        # FIRST-PARTY image, not bitnami/kubectl. `bitnami/kubectl:1.31` was the default here and
        # Bitnami REMOVED those tags from Docker Hub in 2025 — the pull 404s, the pod sits in
        # ImagePullBackOff, and `helm uninstall` dies on a deadline. That is not a cosmetic failure:
        # this Job is what releases the norviq.io finalizers, so when it cannot start, every CR is
        # stranded in Terminating. A later reinstall then ADOPTS those tombstones, the controller
        # loops on a delete the API answers 422, no policy ever loads, and the cluster blocks every
        # tool call on `no_policy_loaded` while looking perfectly healthy. Verified end-to-end on AKS.
        #
        # `$cfc.image` is still honoured for operators who must pin their own, but the default is now
        # an image we build, scan and digest-pin, so no upstream can delete it out from under an
        # uninstall.
        - name: cleanup
          {{- if $cfc.image }}
          image: {{ include "norviq.thirdPartyImage" (dict "root" $ "image" $cfc.image) | quote }}
          {{- else }}
          image: "{{ include "norviq.image" (dict "root" $ "component" .Values.images.bootstrap) }}"
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: scratch
              mountPath: /tmp
          env:
            # A writable HOME on the tmpfs scratch mount — the rootfs is read-only.
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -u
              echo "NRVQ-HOOK-CLEANUP: releasing norviq.io finalizers before the controller is removed"

              # curl + the pod's service-account token instead of kubectl. This Job only ever LISTS the
              # three CRs and PATCHes their finalizers away — plain authenticated REST — so it needs no
              # third-party CLI, and depending on one is what broke it (see the image note above).
              API=https://kubernetes.default.svc
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN="$(cat ${SA}/token)"
              GV=/apis/norviq.io/v1alpha1

              # nrvqpolicies is Namespaced; nrvqclasses and nrvqconfigs are Cluster-scoped, so their
              # patch paths carry no /namespaces/<ns> segment. Getting that wrong 404s and silently
              # leaves the finalizer in place, which is the failure this Job exists to prevent.
              patch_one() {  # patch_one <plural> <ns-or-empty> <name>
                _p="$1"; _ns="$2"; _n="$3"
                if [ -n "$_ns" ] && [ "$_ns" != "null" ]; then
                  _path="${GV}/namespaces/${_ns}/${_p}/${_n}"
                else
                  _path="${GV}/${_p}/${_n}"
                fi
                # || true: a patch can legitimately race the controller finishing its own cleanup, and a
                # 404 there is success, not failure. An uninstall must not fail on it.
                curl -sS --cacert "${SA}/ca.crt" -H "Authorization: Bearer ${TOKEN}" \
                  -H 'Content-Type: application/merge-patch+json' \
                  -X PATCH "${API}${_path}" -d '{"metadata":{"finalizers":[]}}' >/dev/null 2>&1 || true
              }

              for kind in nrvqpolicies nrvqclasses nrvqconfigs; do
                # The CRD may never have been installed — an empty/absent list is not an error.
                body="$(curl -sS --cacert "${SA}/ca.crt" -H "Authorization: Bearer ${TOKEN}" \
                          "${API}${GV}/${kind}" 2>/dev/null || true)"
                echo "$body" | jq -r '.items[]? | "\(.metadata.namespace // "")\t\(.metadata.name)"' 2>/dev/null \
                | while IFS="$(printf '\t')" read -r ns name; do
                    [ -n "$name" ] || continue
                    echo "  patching ${kind} ${ns:-<cluster>}/${name}"
                    patch_one "$kind" "$ns" "$name"
                  done
              done
              echo "NRVQ-HOOK-CLEANUP: done"
              exit 0
{{- end }}
