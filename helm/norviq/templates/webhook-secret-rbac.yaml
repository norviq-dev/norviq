{{- if and .Values.webhook.enabled .Values.webhook.injection.enabled .Values.webhook.injection.credentialSecret.enabled }}
# Secret write for the sidecar injector (C2-019).
#
# The injector used to deliver NRVQ_API_TOKEN and the mTLS client key as literal `value:` entries in
# the pod spec. Kubernetes deliberately excludes Secrets from the built-in `view` ClusterRole — `view`
# grants `get pods` and does NOT grant `get secrets` — so a credential in the spec is readable by
# every principal that a read-only grant was considered safe for: auditors, dashboards, CI. Moving it
# into a Secret restores that boundary, and needs the webhook to be able to write one.
#
# NAMESPACED Role + RoleBinding per target namespace, deliberately NOT a ClusterRole.
#
# The webhook already holds admission-time mutation power over every pod in labelled namespaces;
# handing it cluster-wide `create`/`update` on secrets would make a compromise of it substantially
# more valuable, and that is a poor trade for closing a read-exposure. Bound only in the namespaces
# the operator explicitly lists, so the blast radius of the new privilege is a set someone chose.
#
# `resourceNames` is NOT used: the injector's Secret name is derived from the workload, which is not
# knowable at install time. `create` cannot be constrained by resourceNames in any case.
#
# NO NAMESPACES CONFIGURED -> render nothing, and let the webhook fall back at runtime.
#
# This started out as a `fail`, on the reasoning that a security default should not be skippable in
# silence. Eleven existing chart tests then failed, all rendering `webhook.injection.enabled=true`
# with no namespace list — which is evidence that "injection on, no tenant namespaces declared" is a
# MAINSTREAM configuration here, not an exotic one. Breaking every such upgrade to close a
# read-exposure is the wrong trade, and the exposure is not silent anyway: the injector logs
# NRVQ-WHK-4049 at ERROR for EVERY injected pod, naming the consequence ("readable by anyone with
# `get pod` in this namespace") and the remedy. A per-pod ERROR is a louder signal than a one-time
# install failure someone re-runs with the flag flipped off.
{{- $ns := .Values.webhook.injection.credentialSecret.namespaces | default .Values.policyQuotaNamespaces }}
{{- range $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: norviq-sidecar-credentials
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: norviq
    app.kubernetes.io/component: webhook
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # get is required so an update after AlreadyExists is not a blind write; list/watch are NOT
    # granted — the injector never enumerates secrets and must not be able to.
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: norviq-sidecar-credentials
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: norviq
    app.kubernetes.io/component: webhook
subjects:
  - kind: ServiceAccount
    name: norviq-controller
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: norviq-sidecar-credentials
{{- end }}
{{- end }}
