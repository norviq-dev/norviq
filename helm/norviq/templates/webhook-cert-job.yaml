{{- if .Values.webhook.enabled }}
# TLS bootstrap for the sidecar-injector webhook. A Helm hook Job self-signs a serving cert for
# norviq-webhook.<ns>.svc, writes the norviq-webhook-tls secret the webhook Deployment mounts, and
# patches the MutatingWebhookConfiguration caBundle (the self-signed cert is its own CA). Scoped
# RBAC: namespaced secret writes + cluster patch of the webhook config.
#
# IT RUNS IN BOTH PHASES, PRE *AND* POST, because its two jobs have opposite ordering needs and one
# of them used to deadlock `helm install --wait`:
#
#   * the SECRET must exist BEFORE the chart's resources are waited on. norviq-webhook mounts
#     norviq-webhook-tls non-optionally, so with the Job only in post-install the webhook pods sat in
#     Init with `secret "norviq-webhook-tls" not found`, --wait never succeeded, and the post-install
#     hook that would have created the secret never ran. The install died at its --timeout leaving the
#     release `pending-install`. Nothing about that was specific to a version; it needed --wait and a
#     cluster where the secret did not already exist.
#   * the CABUNDLE PATCH must happen AFTER, because the MutatingWebhookConfiguration it patches is an
#     ordinary chart resource that does not exist yet at pre-install.
#
# Running twice is safe by construction, not by luck: the script reuses an existing serving cert
# rather than reminting one (see the idempotency note below — reminting would diverge the caBundle
# from the cert the running webhook already loaded), and it skips the caBundle patch when the
# MutatingWebhookConfiguration is absent, which is exactly the pre-install case.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: norviq-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,post-install,pre-upgrade,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: norviq-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,post-install,pre-upgrade,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: norviq-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,post-install,pre-upgrade,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: norviq-webhook-cert
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: norviq-webhook-cert
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: norviq-webhook-cert
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,post-install,pre-upgrade,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: norviq-webhook-cert
  labels:
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,post-install,pre-upgrade,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: norviq-webhook-cert
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: norviq-webhook-cert
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: norviq-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    app: norviq-webhook
    {{- include "norviq.labels" . | nindent 4 }}
  annotations:
    # PRE so the serving-cert secret exists before --wait blocks on the webhook Deployment that
    # mounts it; POST so the MutatingWebhookConfiguration exists to have its caBundle patched.
    # See the header comment — dropping either phase reintroduces a real failure.
    "helm.sh/hook": pre-install,post-install,pre-upgrade,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: norviq-webhook
    spec:
      serviceAccountName: norviq-webhook-cert
      {{- /* Hook Jobs pull the SAME images.bootstrap image from the SAME images.registry as every
             Deployment, so they need the same pull auth. Without it a private-registry install
             ImagePullBackOffs here while every other pod starts: the pre-install cert and TLS
             hooks then block `helm install --wait` on a deadline, and the pre-delete finalizer
             cleanup silently fails to release norviq.io/policy-protection, stranding NrvqPolicy
             CRs in Terminating on uninstall. */}}
      {{- include "norviq.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      securityContext:
        # The bootstrap image ships openssl (and curl, which replaces kubectl here), so this hook
        # no longer `apk add`s at runtime and no longer needs root.
        # by OpenShift's default restricted-v2 SCC, which killed `helm install` at this very hook.
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        # Pinned on vanilla/AKS/EKS/GKE, where nothing assigns a UID for you. OMITTED under OpenShift,
        # which allocates a per-namespace UID range (~1000650000+) and rejects any pinned value outside
        # it — the image is built to run under an arbitrary UID in GID 0.
        runAsUser: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cert-bootstrap
          image: "{{ include "norviq.image" (dict "root" $ "component" .Values.images.bootstrap) }}"
          # Bounded so a pre-install bootstrap hook cannot compete for CPU/memory with the
          # enforcement pods it runs ahead of. Root is still required here for the apk/openssl
          # bootstrap (narrowly exempted); being unbounded was not.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Talks to the API with curl + the pod's service-account token — no kubectl in the image.
              # kubectl was removed because it vendors a golang.org/x/net with fixable HIGH/CRITICAL
              # CVEs, which the fail-closed trivy gate in build.yml correctly refused to publish; the
              # three calls below were the only reason it was ever here.
              API=https://kubernetes.default.svc
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN="$(cat ${SA}/token)"
              k() {  # k <method> <path> [body] -> prints body, exits non-zero on >=400
                _m="$1"; _p="$2"; _b="${3:-}"; _ct="${4:-application/json}"
                if [ -n "$_b" ]; then
                  curl -sS --fail-with-body --cacert "${SA}/ca.crt" -H "Authorization: Bearer ${TOKEN}" \
                    -H "Content-Type: ${_ct}" -X "$_m" --data-binary "$_b" "${API}${_p}"
                else
                  curl -sS --fail-with-body --cacert "${SA}/ca.crt" -H "Authorization: Bearer ${TOKEN}" \
                    -X "$_m" "${API}${_p}"
                fi
              }
              NS={{ .Release.Namespace }}
              SVC=norviq-webhook
              SECRET=norviq-webhook-tls
              WEBHOOK=norviq-sidecar-injector
              CN="${SVC}.${NS}.svc"
              TMP="$(mktemp -d)"
              # Idempotent: if the serving cert secret already exists, REUSE it so the cert identity is
              # stable across upgrades (e.g. enabling injection later). Regenerating a fresh cert here
              # while the webhook Deployment keeps serving the one it loaded at startup would make the
              # MutatingWebhookConfiguration caBundle and the served cert diverge -> API-server TLS
              # handshake failures -> injection silently skipped (failurePolicy). Only generate when absent.
              if k GET "/api/v1/namespaces/${NS}/secrets/${SECRET}" > "${TMP}/sec.json" 2>/dev/null; then
                echo "reusing existing serving cert from secret ${SECRET}"
                # pull .data["tls.crt"] without a JSON parser: the value is a single base64 token
                sed -n 's/.*"tls\.crt"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "${TMP}/sec.json" \
                  | head -1 | base64 -d > "${TMP}/tls.crt"
              else
                echo "generating self-signed serving cert for ${CN}"
                openssl req -x509 -newkey rsa:2048 -nodes \
                  -keyout "${TMP}/tls.key" -out "${TMP}/tls.crt" -days 3650 \
                  -subj "/CN=${CN}" \
                  -addext "subjectAltName=DNS:${SVC},DNS:${SVC}.${NS},DNS:${SVC}.${NS}.svc,DNS:${SVC}.${NS}.svc.cluster.local"
                echo "creating secret ${SECRET}"
                B_CRT="$(base64 < "${TMP}/tls.crt" | tr -d '\n')"
                B_KEY="$(base64 < "${TMP}/tls.key" | tr -d '\n')"
                printf '{"apiVersion":"v1","kind":"Secret","type":"kubernetes.io/tls","metadata":{"name":"%s","namespace":"%s"},"data":{"tls.crt":"%s","tls.key":"%s"}}' \
                  "${SECRET}" "${NS}" "${B_CRT}" "${B_KEY}" > "${TMP}/sec-new.json"
                k POST "/api/v1/namespaces/${NS}/secrets" "@${TMP}/sec-new.json" >/dev/null
              fi
              CA="$(base64 < "${TMP}/tls.crt" | tr -d '\n')"
              # The MutatingWebhookConfiguration only exists when injection is enabled; patch its
              # caBundle when present, otherwise skip (the webhook/controller pod still needs the
              # serving cert above so it can start and run the CRD controller).
              MWC=/apis/admissionregistration.k8s.io/v1/mutatingwebhookconfigurations/${WEBHOOK}
              if k GET "${MWC}" >/dev/null 2>&1; then
                echo "patching ${WEBHOOK} caBundle"
                printf '[{"op":"replace","path":"/webhooks/0/clientConfig/caBundle","value":"%s"}]' "${CA}" > "${TMP}/patch.json"
                k PATCH "${MWC}" "@${TMP}/patch.json" "application/json-patch+json" >/dev/null
              else
                echo "MutatingWebhookConfiguration ${WEBHOOK} absent (injection disabled) — skipping caBundle patch"
              fi
              echo "done"
{{- end }}
