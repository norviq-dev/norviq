# SPDX-License-Identifier: Apache-2.0
# The install namespace is taken from `helm -n/--namespace` (.Release.Namespace), the
# standard Helm contract — there is no `namespace:` value. Install with:
#   helm install norviq ./helm/norviq -n <namespace> --create-namespace
# Per-tenant NrvqPolicy quota (ResourceQuota count/nrvqpolicies.norviq.io). OPT-IN: list the tenant
# namespaces you want protected — each must already exist. Empty by default so a fresh install never
# fails on a namespace that hasn't been created yet. Example: [prod-agents, analytics].
# Global settings shared across the chart.
global:
  # Air-gapped / private-mirror host prepended to the THIRD-PARTY images (opa, redis, postgres, the
  # internal-tls nginx proxy, the cert-bootstrap job, the helm-test curl). Empty = pull from their
  # public upstreams. Norviq's own images use images.registry (below) instead. Example:
  #   --set global.imageRegistry=myregistry.example.com
  # then mirror e.g. openpolicyagent/opa, redis, postgres into that registry preserving the path.
  imageRegistry: ""

policyQuotaNamespaces: []

# Mandatory-interception (defense-in-depth): Norviq's tool-call PEP is COOPERATIVE — the agent's
# SDK asks the sidecar for a forward/drop decision and the AGENT executes the tool itself. A pod that
# ignores the SDK can therefore reach tools directly (runtime bypass). This opt-in default-deny egress
# NetworkPolicy bounds that at the NETWORK layer: an agent pod may egress ONLY to the norviq API, DNS, and
# an operator-approved tool allowlist — arbitrary data-exfiltration egress is denied. It does NOT replace
# the PEP (per-call param policy still needs the SDK) and REQUIRES a NetworkPolicy-enforcing CNI
# (Calico/Cilium; kindnet ignores NetworkPolicy). Full non-cooperative enforcement (the sidecar executing
# tools) is a separate roadmap item.
agentEgressPolicy:
  enabled: false
  # Policy engine:
  #   networkpolicy (default) — a portable Kubernetes NetworkPolicy. Allowlist is IP/CIDR-based only.
  #   cilium                  — a CiliumNetworkPolicy that ALSO supports FQDN (hostname) allowlisting
  #                             (allowedFQDNs / allowedFQDNPatterns). Requires the Cilium CNI.
  engine: networkpolicy
  # Namespaces to lock down. Empty => reuse policyQuotaNamespaces (the tenant namespaces).
  namespaces: []
  allowDNS: true
  # Operator-approved tool endpoints the agent may reach (CIDRs). EVERYTHING ELSE (incl. the internet) is
  # denied. Leave empty ONLY if the agent's tools all live in the norviq namespace — otherwise its tool
  # calls will fail. Example: ["10.0.0.0/8"] for in-cluster tool services, or a SaaS API's egress CIDR.
  allowedCIDRs: []
  # engine=cilium ONLY: allow egress by HOSTNAME (Cilium's DNS-aware toFQDNs). Cleaner than chasing a SaaS
  # tool's rotating/CDN IPs. Exact names in allowedFQDNs, wildcards in allowedFQDNPatterns.
  #   allowedFQDNs:        ["api.openai.com", "api.anthropic.com"]
  #   allowedFQDNPatterns: ["*.googleapis.com"]
  allowedFQDNs: []
  allowedFQDNPatterns: []
  # Restrict the allowlisted CIDRs/FQDNs to these TCP ports (empty => all ports).
  allowedPorts: []
  # embedded sidecar mode reaches Redis/Postgres directly (not the API) — set true to also permit egress
  # to the norviq datastores. Leave false for the default proxy mode (sidecar → API only).
  embeddedDatastores: false
# `helm uninstall` cleanup. NrvqPolicy CRs carry the norviq.io/policy-protection finalizer, and only the
# controller clears it — but Helm removes that controller in the same uninstall, so the CRs get stranded in
# Terminating: the uninstall blocks until it times out, the release is left half-removed, and the operator
# must hand-patch every CR before reinstalling. This pre-delete hook Job releases the finalizers first,
# while the API is still up. Best-effort by design (it never fails the uninstall). Disable only if your
# cluster forbids hook Jobs — then strip the finalizers yourself before `helm uninstall`.
crdFinalizerCleanup:
  enabled: true
  # EMPTY = use the first-party bootstrap image (openssl + curl + jq), which is what you want.
  # This defaulted to "bitnami/kubectl:1.31" until Bitnami removed those tags from Docker Hub:
  # the pull 404s, the hook never runs, `helm uninstall` fails on a deadline, and every CR is
  # left stranded in Terminating with its norviq.io finalizer intact. Set this only to pin an
  # image you mirror yourself; it must provide /bin/sh, curl and jq.
  image: ""

baselineClusterPolicy:
  enabled: true
  name: baseline-cluster-guard
  clusterPriority: 900
  preset: strict
  # audit (default) — every baseline control EVALUATES and records a non-compliance event, and the
  # call proceeds. block — the baseline refuses the call outright.
  #
  # This shipped as `block`, which meant installing the chart silently put 22 block rules in front of
  # every tool call in every tenant namespace, on day one, before the customer had written a single
  # policy or seen a single decision. The failure mode is not theoretical: `deny_shell_execution`
  # fires on roughly 1 in 8 ordinary alphanumeric identifiers (the base64 fan-out decodes an order id
  # to random bytes and matches `|` in them), so a stock install drops a real fraction of a support
  # bot's legitimate lookups and attributes it to shell injection.
  #
  # Defaulting to `audit` inverts the install experience: Norviq arrives observing, the customer sees
  # in the compliance view exactly what WOULD be blocked and by which control, and promotes controls
  # to enforcement when the blast radius is known. Set to `block` here to restore the old posture
  # cluster-wide, or promote individual controls via the baseline controls API.
  enforcementMode: audit

images:
  # Registry prefix (trailing slash) prepended to every component repository. Defaults to the
  # project's public GHCR org, so `helm install` pulls the official public images out of the box.
  # Override to run your own build, e.g.:
  #   Your own GHCR:            "ghcr.io/<your-org>/"
  #   Google Artifact Registry: "us-docker.pkg.dev/<PROJECT_ID>/<REPO>/"
  #   ACR:                      "<acct>.azurecr.io/"
  #   Docker Hub:               "" (+ set repository to "<user>/norviq-engine")
  registry: "ghcr.io/norviq-dev/"
  # `digest` is empty here and is STAMPED BY THE RELEASE WORKFLOW (.github/workflows/release.yml).
  # When set it wins over `tag`, making a released chart reproducible: `--version X` always pulls the
  # exact image built, scanned and signed for X. Leave it empty to track the readable tag instead.
  engine:
    repository: norviq-engine
    tag: engine-latest
    digest: ""
    pullPolicy: Always
  api:
    repository: norviq-engine
    tag: api-latest
    digest: ""
    pullPolicy: Always
  ui:
    repository: norviq-engine
    tag: ui-latest
    digest: ""
    pullPolicy: Always
  webhook:
    repository: norviq-engine
    tag: webhook-latest
    digest: ""
    pullPolicy: Always
  # Bootstrap image for the chart's TLS hooks: carries openssl + curl (NOT kubectl) so the hooks
  # need neither a runtime `apk add` nor root. First-party so the release workflow can pin it by
  # digest — a hook that patches a webhook's caBundle must not pull an unpinned image.
  bootstrap:
    repository: norviq-engine
    tag: bootstrap-latest
    digest: ""
    pullPolicy: Always
  redis:
    repository: redis
    tag: "7-alpine"
  postgresql:
    repository: postgres
    tag: "16-alpine"

# Pull secrets for the component images. The default public GHCR images need NONE (empty list).
# Set a pull-secret name here only if you point `images.registry` at a private registry.
imagePullSecrets: []

# Graceful shutdown: a preStop sleep lets the Service deregister the endpoint before SIGTERM so
# in-flight requests drain during a rolling upgrade. Applied to api/engine/webhook. 0 = no hook.
# `helm test` connection-probe pod image (curl). Override for an air-gapped mirror.
tests:
  image: "curlimages/curl:8.10.1"

# Extra annotations stamped onto every norviq pod template. Chiefly a rollout lever: a value that
# changes with each build (an image ID, a git sha) forces the Deployment to actually roll, which a
# rebuilt-but-same-tag image otherwise will not — see scripts/kind-e2e/00-up.sh.
podAnnotations: {}

gracefulShutdown:
  # How long a terminating pod keeps serving before its process is asked to stop. This is NOT a
  # politeness setting — it is the window in which the pod's removal from the Service endpoints
  # propagates to every kube-proxy/dataplane. Until that lands, traffic is still being routed to a pod
  # that is on its way out, and for a policy enforcement point that traffic does not merely fail: the
  # engine fails CLOSED, so the agent's tool call is REFUSED. A rolling update quietly denies a slice
  # of legitimate agent actions.
  #
  # MEASURED, not guessed (scripts/kind-e2e/chaos.py, scenario 1 — delete one replica under ~1,500
  # concurrent evaluate calls):
  #     preStopSleepSeconds: 3   ->  1 and 31 benign calls refused across two runs
  #     preStopSleepSeconds: 15  ->  0, 0 and 2 refused across three runs
  # Never once in the fail-OPEN direction, which is the property that actually matters; the cost of the
  # short window was availability, not safety.
  #
  # 15s sits inside the 30s terminationGracePeriodSeconds with room for the app's own shutdown. The
  # residual (~0.1%) is not eliminated by a longer sleep — that tail needs connection draining, not
  # more waiting — so it is left visible rather than tuned into apparent perfection.
  preStopSleepSeconds: 15

# Hardened container securityContext for the primary app containers (defense-in-depth). The
# chart sets it inline rather than relying on an external PSA/Kyverno restricted-profile mutation
# ("injected by cluster policy"), which need not exist on the target cluster.
# This restricted profile matches the opa/tls-proxy sidecars: non-root, no privilege escalation, all caps
# dropped, seccomp RuntimeDefault, read-only root FS. Consumers whose container writes its root FS must
# provide a writable emptyDir mount (the api/engine/webhook images already run as a non-root USER, and the
# webhook writes nothing to its rootfs). The UI (nginx) is NOT covered by this default — it runs as root
# and binds :80, so it needs a component-specific uid/port/emptyDir treatment. Set enabled:false to defer
# entirely to a cluster-level PodSecurity/Kyverno policy.
securityContext:
  enabled: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

engine:
  replicas: 1
  pdb:
    enabled: false     # multi-node prod: keep >=1 engine available during disruptions
    minAvailable: 1
  # HPA (multi-node prod): off by default (single node can't autoscale). Needs metrics-server.
  # When enabled the Deployment drops its static `replicas` and the HPA owns the count (min..max),
  # scaling on CPU and/or memory. The standalone engine is on the enforcement hot path, so give it
  # the same elasticity as the API in a prod profile (see values-prod.yaml).
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""   # "" = do not scale on memory; set e.g. 75 to add it
  spread:
    enabled: false
  rollout:
    maxSurge: 1        # production default: zero-downtime (needs node headroom for a surge pod)
    maxUnavailable: 0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  port: 8282

api:
  replicas: 2          # HA default: survive a single pod restart/drain without an enforcement gap
  pdb:
    enabled: true      # keep >=1 API pod available during voluntary disruptions (node drain/upgrade)
    minAvailable: 1
  # HPA (multi-node prod): off by default (single node can't autoscale). Needs metrics-server.
  # When enabled the Deployment drops its static `replicas` and the HPA owns the count, scaling
  # between minReplicas and maxReplicas on CPU and/or memory utilization.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""   # "" = do not scale on memory; set e.g. 75 to add it
  # Spread replicas across nodes (multi-node prod): podAntiAffinity + topologySpreadConstraints.
  spread:
    enabled: false
  rollout:
    maxSurge: 1        # production default: zero-downtime (needs node headroom for a surge pod)
    maxUnavailable: 0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      # 500m throttled this pod on 92.5% of CFS periods under a sustained single-client load —
      # 23.8s of throttle across 400 evaluations, ~60ms of pure wait added to EVERY call. Caller-
      # observed p50 was 115ms and p95 172ms; raising this limit alone (nothing else changed) took
      # them to 62ms and 101ms with ZERO throttled periods. One evaluation costs ~69ms of CPU, so a
      # 500m ceiling caps a replica near ~7 evaluations/sec and the excess is paid as latency.
      #
      # Only the LIMIT moves. `requests` stays at 100m deliberately: requests drive scheduling, so
      # raising them can make this chart unschedulable on a small cluster — on a 2-node/2-vCPU AKS a
      # 1000m request did not fit at all. A higher limit changes no scheduling decision; it only
      # stops the kernel parking a pod that has work to do.
      #
      # Lower this if you are deliberately capping a noisy tenant, but the cost of a low cap here is
      # paid as p95 latency on every enforcement decision.
      cpu: 2000m
      # MEMORY got the same treatment as cpu above, for the same reason: it was sized before the API
      # ran more than one worker, and never re-measured.
      #
      # Measured at IDLE on AKS with a single uvicorn worker: 214Mi against a 256Mi limit — 84% full
      # doing nothing. That left no room to serve a burst, and none at all to run the `--workers`
      # the container now starts (each worker is a separate PROCESS with its own heap).
      #
      # 1Gi carries 4 workers with real headroom. As with cpu, only the LIMIT moves: `requests` stays
      # at 128Mi so the chart still schedules on a small cluster, and a limit that is never reached
      # costs nothing.
      memory: 1Gi
  # Uvicorn worker processes. Without this the API ran ONE event loop per pod, so a pod served one
  # request at a time regardless of its CPU limit — and /api/v1/evaluate is in front of every agent
  # tool call. Measured before: p50 66 -> 131 -> 291ms at concurrency 1/2/4 (linear: a queue, not
  # work), and past ~4 concurrent it crossed the engine's 2s budget and FAILED CLOSED, refusing 92%
  # of ordinary calls. Track this to the cpu limit; raising it needs memory to match.
  workers: 4
  port: 8080
  # Leave this at the sentinel default and the chart AUTO-GENERATES a strong random secret on
  # first install (templates/secret.yaml), persisting it across `helm upgrade` (a live cluster lookup)
  # so upgrades never invalidate existing sessions/JWTs. Set an explicit value here to pin your own
  # secret instead (e.g. rotation, multi-cluster fleet trust) — it always wins over auto-generation.
  secretKey: "change-me-in-production"
  # An `api.env:` list used to sit here. No template ever read it — api-deployment.yaml's env surface is
  # envFrom(norviq-config, norviq-secrets) plus an optional BYO-datastore var — so every entry was inert.
  # Worse, it advertised NRVQ_DB_SSL_MODE: "require" while norviq-config renders "disable" for the
  # bundled non-TLS StatefulSet, so it read as a security assurance the pods did not have. The real keys
  # are config.dbPoolMaxOverflow / dbPoolTimeout / dbCommandTimeout, and TLS is chosen by the
  # norviq.dbSslMode helper (see config.dbSslMode). Removed rather than wired: wiring it as written
  # would set sslmode=require against the bundled Postgres and break a stock install on first boot.

ui:
  replicas: 1
  # Set to "/fleet-api" on the HUB cluster so the console shows the multi-cluster Fleet view (same-origin,
  # proxied by nginx to norviq-fleet-api). Empty on spokes/single-cluster → Fleet view stays gated off.
  fleetApiUrl: ""
  rollout:
    maxSurge: 1        # production default: zero-downtime (needs node headroom for a surge pod)
    maxUnavailable: 0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # The console runs on the unprivileged nginx image (uid 101) which binds an unprivileged
  # port, so the container does not run as root. 8080 needs no NET_BIND_SERVICE, letting the pod drop
  # ALL caps. The Service + probes reference the named "http" port, so this cascades automatically.
  port: 8080

# OpenShift / restricted-SCC compatibility.
#
# OpenShift assigns each namespace a UID RANGE (typically ~1000650000+) and admits pods with a UID
# from that range and GID 0. A chart that pins `runAsUser` is rejected by the default restricted-v2
# SCC no matter which UID it pins, because the pinned value is almost never inside the namespace's
# allocated range.
#
# With this ON the chart OMITS runAsUser/runAsGroup/fsGroup entirely and lets the platform assign,
# while keeping `runAsNonRoot: true` so the security guarantee is unchanged — the platform enforces
# non-root, we just stop dictating WHICH non-root user.
#
# Leave OFF for vanilla Kubernetes / AKS / EKS / GKE, where pinning an explicit non-root UID is the
# stronger posture (nothing assigns one for you there).
openshift:
  enabled: false

webhook:
  enabled: true
  # Turnkey sidecar injection: render the MutatingWebhookConfiguration from the chart and
  # auto-bootstrap TLS via a pre/post-install hook Job (self-signs a cert, writes the
  # norviq-webhook-tls secret, patches the webhook caBundle). No cert-manager required.
  # Enable with --set webhook.injection.enabled=true, then label target namespaces:
  #   kubectl label ns <ns> norviq-injection=enabled
  injection:
    enabled: false
    # Injected-sidecar evaluation mode. "proxy" (DEFAULT) = the sidecar POSTs each tool call to
    # the central norviq-api /evaluate with a namespace-scoped service JWT (DB/OPA stay centralized,
    # nothing per-pod). "embedded" = the sidecar runs its own RedisCache+OPA(subprocess)+PolicyLoader
    # for air-gapped/edge (the chart then wires NRVQ_REDIS_URL/NRVQ_PG_URL through to the injector).
    sidecarMode: proxy
    # Deliver the injected sidecar's credentials (NRVQ_API_TOKEN + the mTLS client cert/key) through a
    # Secret + valueFrom.secretKeyRef instead of literal `value:` entries in the pod spec.
    #
    # WHY it matters: Kubernetes deliberately excludes Secrets from the built-in `view` ClusterRole
    # (`view` grants `get pods`, not `get secrets`), so a credential in the pod spec is readable by
    # anyone a read-only grant was considered safe for. It also lands in etcd, `kubectl describe`, and
    # any GitOps diff.
    #
    # Needs namespaced Secret write for the webhook — a Role+RoleBinding is rendered in each namespace
    # below (NOT a ClusterRole; see webhook-secret-rbac.yaml for the reasoning). If the webhook cannot
    # write the Secret it FALLS BACK to literal pod env and logs NRVQ-WHK-4049 rather than refusing to
    # schedule, because this webhook runs failurePolicy: Fail. Set `required: true` to refuse instead.
    credentialSecret:
      enabled: true
      required: false
      # Namespaces labelled norviq-injection=enabled. Defaults to policyQuotaNamespaces.
      namespaces: []
    # MCP action-firewall injection — the same zero-code-change deal the sidecar gives the SDK, for
    # Model Context Protocol traffic. A pod opts in per container:
    #
    #   metadata:
    #     annotations:
    #       norviq.io/mcp-servers: "filesystem,github"     # containers whose command IS an MCP server
    #       norviq.io/mcp-server-id.github: "github-prod"  # optional stable pin id (default: the name)
    #
    # The injector rewrites each named container's command to exec the proxy, and an init container
    # copies that proxy in from proxyImage — so the MCP server's own image needs nothing installed.
    #
    # Two admission rules follow from "never leave a named server ungoverned": a name that matches no
    # container, and a container with no explicit `command` (its argv is the image ENTRYPOINT, which
    # admission cannot see), are both DENIED rather than skipped.
    mcp:
      enabled: false
      # REQUIRED when enabled, with no fallback. Must hold the relocatable payload at proxySourcePath;
      # build it with scripts/mcp-proxy-payload.Dockerfile and confirm it runs in the images your MCP
      # servers actually use with scripts/mcp-proxy-payload-verify.sh. Defaulting this to the engine
      # image was wrong — that image carries the norviq package, not the frozen payload, so the init
      # container's `cp` found nothing and every governed pod failed at start.
      proxyImage: ""
      proxySourcePath: /opt/norviq/mcp-proxy
      # Where Gate-A definition pins live. `control-plane` is the right posture in a cluster: pins are
      # approvals, so they belong with policy — tenant-scoped, RBAC'd, audited, console-visible, and
      # not lost when a pod restarts. `memory`/`file` exist for air-gapped single-process use.
      pinStore: control-plane
      # `tofu` trusts a server's definitions on first sight; `strict` quarantines them until an
      # operator approves. strict is safer and needs an approval workflow to be practical.
      pinMode: tofu
    # Resources for the INJECTED sidecar, chosen per sidecarMode. `proxy` is a thin forwarder;
    # `embedded` runs a whole engine in the pod (redis client, policy warm, audit emitter, pubsub
    # watcher, plus an OPA subprocess) and was OOMKilled at the proxy budget in every release before
    # 0.1.9 — the embedded numbers below are MEASURED peak working set plus headroom, not a guess.
    sidecarResources:
      proxy:
        requests: { cpu: 50m, memory: 64Mi }
        limits:   { cpu: 200m, memory: 128Mi }
      embedded:
        # MEASURED, not guessed (kind, 2026-07-29, cgroup memory.peak inside the sidecar):
        #   at rest            peak 163Mi   steady 157Mi
        #   after 80 evaluations (each forking OPA under NRVQ_OPA_MODE=subprocess)
        #                      peak 214Mi   steady 158Mi
        #   CPU at warm-up     213m  (already above the proxy profile's 200m LIMIT)
        # request sits ABOVE the measured peak on purpose: an enforcement sidecar that gets evicted
        # under node pressure fails the workload it is guarding, so eviction-safety beats packing
        # density here. The limit leaves ~79% headroom over peak for larger payloads and GC spikes.
        requests: { cpu: 200m, memory: 256Mi }
        # The CPU limit is 2000m, not 500m, and that is the difference between this mode helping and
        # HURTING. Measured on AKS through a real injected sidecar, two runs each, all three rows taken
        # back-to-back in ONE session so they are directly comparable:
        #
        #   proxy (same session)    p50 59.0ms   p95 92.7ms
        #   embedded @ 500m         p50 72.0ms   p95 93.1ms    58.9% of CFS periods THROTTLED
        #   embedded @ 2000m        p50 30.7ms   p95 58.0ms    0% throttled
        #
        # The proxy row is a single-session reading; a later settled-cluster median of three runs put proxy
        # at ~66ms p50 / ~121ms p95. So 59/92.7 is the OPTIMISTIC end of proxy's range, which means
        # embedded's advantage here is understated rather than inflated. The two embedded rows remain a
        # clean like-for-like A/B of the CPU limit alone.
        #
        # At 500m, embedded was SLOWER than the proxy default it exists to beat — so an operator who
        # enabled it got a worse result than leaving it off, with nothing to indicate why. One evaluation
        # costs ~69ms of CPU and embedded runs the WHOLE engine in the pod (redis client, policy warm,
        # audit emitter, plus an OPA subprocess fork per call), so a 500m ceiling throttles it hard. The
        # 213m warm-up figure noted above is a WARM-UP measurement, not a sustained-load one.
        #
        # As with the api limit, only the LIMIT is generous: `requests` stays at 200m, so scheduling
        # density is unchanged and this cannot make a pod unschedulable. Memory is unchanged — 384Mi was
        # measured against real peak (214Mi), and no OOM or restart was observed under load.
        limits:   { cpu: 2000m, memory: 384Mi }
    # DATA-PLANE posture: what a GOVERNED AGENT does when the central engine is unreachable. Distinct
    # from failurePolicy below, which is the ADMISSION posture (whether a pod may be created at all).
    #   "allow" (DEFAULT) = fail-OPEN. Tool calls are forwarded during an outage so the customer's
    #     agents keep working. Each one is audited as rule_id=thin_proxy_fail_open — never as a policy
    #     allow — so "we went unjudged" is countable and alertable rather than silent.
    #   "block"           = fail-CLOSED. No ungoverned tool call, ever, at the cost of taking every
    #     agent in the cluster down with us for as long as the engine is down.
    # This applies ONLY to a genuine outage (5xx / timeout / connection error). A 4xx is the engine
    # ANSWERING with a refusal — an expired token, a malformed request — and ALWAYS blocks regardless of
    # this setting, so "allow" cannot turn a revoked credential into a silent bypass.
    # Both data-plane paths retry with backoff first, so this only decides what happens after a
    # SUSTAINED outage, not during a rolling restart or a brief blip.
    #
    # Defaulted to block until it was measured against the product's actual posture: Norviq sits in the
    # request path of production agents, and a security control whose failure mode is a customer outage
    # gets removed from that path, which protects nobody. Must track config.py's sdk_fallback_mode —
    # this value is stamped into every injected sidecar and silently wins over the Python default.
    fallbackMode: allow
    # Gate admission on the pod's agent-class label instead of the whole namespace (DEFAULT true).
    # Without this, `norviq-injection=enabled` on a namespace routes EVERY pod created there through the
    # injector — the namespace's database, ingress controller, batch jobs — so with failurePolicy: Fail a
    # Norviq outage blocks pod creation for workloads Norviq does not even govern. Gating on the label
    # keeps the fail-closed guarantee where it matters (an agent pod still cannot start un-injected) and
    # makes Norviq invisible to everything else.
    #
    # OPT-IN CONTRACT: a pod is governed when its namespace has `norviq-injection=enabled` AND the pod
    # carries `norviq.io/agent-class=<class>`. Running pods are never touched — the rule is CREATE-only,
    # so this takes effect as pods are recreated.
    #
    # UPGRADE CARE: if you have agent pods relying on namespace-wide injection WITHOUT an agent-class
    # label, they stop being injected on their next restart, and that is SILENT — the pod starts fine,
    # it is simply ungoverned.
    #
    # This comment used to promise that "the console raises an 'ungoverned agent pods' warning for
    # exactly this case". It does not: system_health.py reports only the fixed infra verdicts read back
    # from audit_log, and nothing anywhere computes injected-vs-expected. Saying otherwise told an
    # operator a compensating control existed, which is worse than the gap itself. Until it is built,
    # verify by hand after an upgrade:
    #   kubectl get pods -n <ns> -l norviq.io/agent-class -o name          # will be injected
    #   kubectl get pods -n <ns> -L norviq.io/agent-class                  # blanks are NOT
    # Or set this to false to keep the previous namespace-wide behaviour.
    gateOnlyAgentPods: true
    # Admission failure posture for the injector. "Fail" (DEFAULT) = fail-CLOSED: if the injector is
    # unavailable, creation of a pod the webhook ROUTES is REJECTED so a routed pod can never start
    # un-guarded. Note what that does NOT cover: with gateOnlyAgentPods: true (above) only pods carrying
    # norviq.io/agent-class are routed, so an unlabelled pod starts ungoverned no matter what this is set
    # to (correct for a policy-enforcement product; the webhook is HA — 2 replicas + PDB,
    # and the control-plane/kube-system namespaces are excluded from the selector so this never self-
    # deadlocks). Set "Ignore" (fail-open) only for a dev/eval cluster where an un-injected pod is
    # acceptable.
    failurePolicy: Fail
    # NOTE ON THE HA THIS DEFAULT ASSUMES: 2 replicas + topology spread (above) are ON, but webhook.pdb is
    # OFF by default (a PDB blocks node drains on a single-node cluster). On a MULTI-NODE cluster set
    # webhook.pdb.enabled=true, otherwise one drain can evict both replicas and reject pod creation in
    # every governed namespace until they reschedule.
    # Honor the per-pod injection opt-out (norviq-injection=disabled label / norviq.io/skip-injection
    # annotation)? Default true (backward-compatible). Set false so a ROUTED pod cannot self-exempt (a
    # real bypass otherwise). This is not namespace-uniform while gateOnlyAgentPods is true: omitting
    # norviq.io/agent-class is an earlier exit this does not close. Pair with RBAC on the agent-class
    # label as well as on pod opt-out label/annotation writes.
    allowPodOptOut: true
    # First-party bootstrap image for the TLS hooks. It carries openssl (self-sign the internal CA)
    # and curl (talk to the API server with the pod's service-account token). It deliberately does
    # NOT carry kubectl: vendoring that Go binary pulled its CVEs into our own fail-closed trivy
    # gate, which then refused to publish the image. The hooks only ever GET/PATCH a
    # MutatingWebhookConfiguration and apply a Secret — plain authenticated REST calls.
    # The old alpine/k8s image had kubectl but NOT openssl, so the hooks ran `apk add openssl` at
    # install time — which needs root, which OpenShift's restricted-v2 SCC rejects outright, killing
    # `helm install` at the pre-install hook. Baking openssl in also drops a network dependency from
    # the install path, so the hooks work air-gapped.
  replicas: 2
  pdb:
    enabled: false     # multi-node prod
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""   # "" = do not scale on memory; set e.g. 75 to add it
  spread:
    # ON by default, unlike the other components: the injector is the ONLY workload whose unavailability
    # REJECTS pod creation in every injection-enabled namespace (failurePolicy: Fail). Both replicas landing
    # on one node turns a routine node drain into a pod-creation outage across every governed namespace —
    # observed exactly that on a 2-node cluster during an outage drill. The constraint is SOFT
    # (whenUnsatisfiable: ScheduleAnyway, see _helpers.tpl), so a single-node cluster still schedules both
    # replicas: enabling it costs nothing and removes the co-location failure mode.
    enabled: true
  rollout:
    maxSurge: 1        # production default: zero-downtime (needs node headroom for a surge pod)
    maxUnavailable: 0
  port: 8443
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Inject the SPIFFE Workload API socket + workload-api mode into injected workloads. OFF by default
  # (needs SPIRE + the SPIFFE CSI driver). Uses config.spiffeMode/spiffeSocket for the injected env.
  spiffe:
    inject: false
  # The controller mints its API bearer via OIDC client-credentials (Keycloak service client) instead
  # of the HS256 service token. OFF by default (HS256 fallback). Set the client secret in api.oidcClientSecret.
  oidc:
    enabled: false
    tokenUrl: ""        # e.g. http://keycloak.localtest.me:8080/realms/norviq/protocol/openid-connect/token
    clientId: norviq-webhook
    clientSecret: ""    # the Keycloak confidential client secret (rendered into norviq-secrets when enabled)

redis:
  # true  = the chart runs a bundled Redis for you (single StatefulSet, or Sentinel when ha.enabled).
  # false = BRING YOUR OWN (ElastiCache, Azure Cache, Memorystore, an existing in-cluster Redis). Nothing
  #         is deployed; set `host` (and usually `existingSecret`) to point Norviq at it.
  enabled: true
  # External Redis hostname. EMPTY = the bundled service (`norviq-redis`, or ha.serviceName under HA).
  # REQUIRED when enabled=false — the chart refuses to render an address it would only guess wrong.
  #   --set redis.enabled=false --set redis.host=mycache.redis.cache.windows.net
  host: ""
  # PRODUCTION credential path: name of a Secret YOU manage holding the full Redis URL. When set, the
  # chart never renders or generates a Redis credential — the pods read the URL straight from your
  # Secret, so it never passes through values, `--set` (which lands in `helm history` and your shell
  # history) or the chart's own Secret. Create it with e.g.:
  #   kubectl create secret generic my-redis --from-literal=url='rediss://:PW@host:6380/0'
  existingSecret: ""
  existingSecretKey: "url"
  replicas: 1
  # HA (multi-node prod, GATED, not live-validated on 1 node): when true, render a Redis HA topology
  # (Sentinel) instead of the single StatefulSet. Requires the operator/Sentinel chart pre-installed.
  ha:
    enabled: false
    replicas: 3
    # The chart RENDERS this Service itself (templates/redis-ha.yaml) — the operator does not. It
    # provisions a sentinel Service (`rfs-<name>:26379`) and no stable master endpoint, because its
    # intended clients speak the Sentinel protocol; Norviq's client is a plain `redis://` URL. The
    # Service selects the operator's `redisfailovers-role: master` pod label, so it tracks the
    # current master and follows failover with no client changes. Failover-tested 2026-07-29: master
    # killed, replica promoted, the Service endpoint moved and the API recovered on its own.
    serviceName: norviq-redis-ha
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  port: 6379
  # EMPTY = the chart GENERATES a strong random password on first install and stores it in the
  # norviq-secrets Secret, reusing it on every upgrade (never rotating it out from under a live cache).
  # The redis StatefulSet reads that same key, so nothing has to be supplied for `helm install` to work.
  # Set a value here (or use a sealed secret) to bring your own — required when redis.ha.enabled=true.
  # Read the generated one with:
  #   kubectl get secret norviq-secrets -o jsonpath='{.data.NRVQ_REDIS_PASSWORD}' | base64 -d
  password: ""
  storage: 1Gi

postgresql:
  # true  = the chart runs a bundled Postgres for you (single StatefulSet, or CloudNativePG under HA).
  # false = BRING YOUR OWN (RDS, Cloud SQL, Azure Database, an existing in-cluster Postgres). Nothing is
  #         deployed; set `host` (and usually `existingSecret`) to point Norviq at it. This is the usual
  #         production shape — a managed database with its own backups, HA and patching.
  enabled: true
  # External Postgres hostname. EMPTY = the bundled service (`norviq-postgresql`, or ha.serviceName under
  # HA). REQUIRED when enabled=false — the chart refuses to render an address it would only guess wrong.
  #   --set postgresql.enabled=false --set postgresql.host=mydb.postgres.database.azure.com
  # config.dbSslMode is derived (empty default): `require` for a managed database, `disable` for the
  # bundled non-TLS StatefulSet. Set it explicitly to pin one.
  host: ""
  # PRODUCTION credential path: name of a Secret YOU manage holding the full Postgres URL. When set, the
  # chart never renders or generates a DB credential — the pods read the URL straight from your Secret,
  # so it never passes through values or `--set` (which lands in `helm history` and your shell history).
  # The URL carries user/password/host/port/database, so those keys below are then unused. Create it with:
  #   kubectl create secret generic my-pg --from-literal=url='postgresql://user:PW@host:5432/norviq'
  existingSecret: ""
  existingSecretKey: "url"
  replicas: 1
  # HA (multi-node prod, GATED, not live-validated on 1 node): when true, render a CloudNativePG
  # `Cluster` (3 instances) instead of the single StatefulSet, and point the API's PG URL at its
  # service. Requires the CloudNativePG operator pre-installed in the cluster.
  ha:
    enabled: false
    instances: 3
    serviceName: norviq-postgresql-ha-rw
    # The CloudNativePG OPERAND image — deliberately NOT images.postgresql, which is the bundled
    # StatefulSet's stock `postgres:16-alpine`. CNPG hardcodes postgresUID/postgresGID 26 and runs
    # initdb as that UID; in postgres:16-alpine the postgres user is UID 70, so initdb aborts with
    # "could not look up effective user ID 26: user does not exist" and the cluster NEVER
    # bootstraps. CNPG only supports images built to its own contract. Override to mirror it into
    # your registry, or to pin a different major.
    image: "ghcr.io/cloudnative-pg/postgresql:16"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  port: 5432
  database: norviq
  username: norviq
  # EMPTY = the chart GENERATES a strong random password on first install and stores it in the
  # norviq-secrets Secret, reusing it on every upgrade (postgres only honours POSTGRES_PASSWORD at
  # initdb, so rotating it under an existing PVC would strand the database — the chart never does).
  # The postgres StatefulSet reads that same key, so `helm install` needs no flags.
  # Set a value here (or use a sealed secret) to bring your own — required when postgresql.ha.enabled=true.
  # Read the generated one with:
  #   kubectl get secret norviq-secrets -o jsonpath='{.data.NRVQ_PG_PASSWORD}' | base64 -d
  password: ""
  storage: 5Gi

otel:
  # OTLP trace export to a collector (gRPC), gated by this flag. Empty endpoint by default: enabling
  # trace export requires you to point it at a real collector (--set otel.endpoint=http://<collector>:4317).
  # The chart FAILS the render if enabled=true with an empty endpoint, so spans are never silently
  # dropped into a void. (No collector ships with Norviq — deploy one, e.g. an OpenTelemetry Collector or
  # Grafana Tempo, and set the endpoint to its OTLP gRPC address.)
  enabled: false
  endpoint: ""
  # Prometheus metrics are ALWAYS served at /metrics on the norviq-api Service port (api.port),
  # regardless of otel.enabled. There is NO separate metrics port. The knobs below only control how your
  # Prometheus DISCOVERS that endpoint — nothing here changes whether metrics are produced. NOTE: counters
  # are per-replica and in-memory, so with api.replicas > 1 you MUST scrape per-pod (ServiceMonitor or the
  # scrape annotations below) and sum across pods — a single Service-level scrape reads only one replica.
  metrics:
    # Annotation-based discovery: add prometheus.io/scrape + port + path to the norviq-api Service,
    # for a Prometheus configured to scrape by pod/service annotations.
    scrapeAnnotations: false
    # Prometheus Operator (kube-prometheus-stack) ServiceMonitor. Requires the monitoring.coreos.com
    # CRDs to be installed (they ship with the operator); enable only when you run it.
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      # Extra labels so your Prometheus's serviceMonitorSelector picks this up
      # (e.g. {release: kube-prometheus-stack}).
      additionalLabels: {}

# Long-lived OPA policy engine, run as a sidecar in the api and engine pods (localhost:8181).
# Each replica gets its own OPA -> no shared single point of failure. config.opaMode=server (default)
# queries it over HTTP; set config.opaMode=subprocess to roll back to the per-call `opa eval` fork.
# Pinned (not `latest-static`) so the running OPA version stays matched to the one
# scripts/gen-opa-capabilities.py generated helm/norviq/files/opa-capabilities.json from (verified real,
# multi-arch amd64+arm64, via `docker manifest inspect openpolicyagent/opa:1.19.1-static`) — `latest-static`
# could silently drift to a version with a different builtin set than what the engine-layer capabilities
# check (norviq/engine/opa_client.py::_check_capabilities) validates against.
opa:
  enabled: true
  image: "openpolicyagent/opa:1.19.1-static"
  port: 8181
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      # 250m was too tight to COMPILE with, even though it was ample to evaluate with. Rego compilation
      # is a CPU-bound burst that happens whenever a policy is created or edited, and OPA stops answering
      # queries while it recompiles its module store. Throttled at 250m that burst ran past the engine's
      # 2s evaluation budget, so the first tool call after every policy change was wrongly blocked
      # (fail-closed `evaluator_timeout`). Measured on AKS: 250m → 0/5 correct on the first call after a
      # policy save, 1500m → 5/5. Steady-state evaluation is unaffected either way (it uses ~7m), so this
      # limit exists for the compile burst, not the query path.
      cpu: 1500m
      # ...and the same for memory, which never had the measurement cpu got. OPA sat at 117Mi against
      # a 128Mi limit at idle — 91% full — and was OOMKilled (exit 137) during a run that pushed
      # several policies concurrently. Rego COMPILATION is a burst in memory as well as CPU: the whole
      # module store is rebuilt, so peak scales with how many policies exist, not with query rate.
      # 512Mi is measured headroom for that burst, not a guess; steady-state evaluation stays ~117Mi.
      memory: 512Mi

ingress:
  # Console exposure. DEFAULT OFF, following the Grafana / Istio convention: the out-of-the-box access
  # path is `kubectl port-forward svc/norviq-ui` (see NOTES.txt) — no ingress controller or certificate
  # required to get started. Turn this on for a persistent URL in production.
  enabled: false
  className: nginx
  host: norviq.example.com
  # TLS for the enterprise HTTPS path. The chart deliberately does NOT generate an ingress certificate
  # (a self-signed cert is useless for real HTTPS and hides a false "TLS works") — this matches Grafana
  # and Istio, which leave the ingress/gateway cert to the operator. Set tls=true and EITHER pre-create
  # the secret named below OR issue one via a cert-manager annotation (see `annotations`). With tls=true
  # and no such cert, the ingress falls back to the controller's default self-signed cert. tls=false
  # serves plaintext (dev only).
  tls: false
  tlsSecretName: norviq-ingress-tls
  # Extra ingress annotations (e.g. cert-manager.io/cluster-issuer, body-size, timeouts). The console
  # nginx already proxies /api/* to the API, so a single host routes both UI and API — no path rewrite.
  annotations: {}

config:
  # Zero-touch internal TLS/mTLS for control-plane traffic. When true (DEFAULT), a Helm hook auto-mints
  # an internal CA + the API serving cert, the API pod runs a TLS terminator on :8443, and the injector
  # gives each sidecar a CA-signed client cert for mTLS to the control plane — all automatic, no operator
  # certs/CSRs. Set false only for a plaintext dev cluster.
  internalTls:
    enabled: true
    proxyImage: "nginx:1.27-alpine"
    # Resources for the api tls-proxy sidecar (nginx terminating internal TLS on :8443).
    proxyResources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 64Mi }
  logLevel: INFO
  enforcementMode: block
  # What a namespace with NO policy loaded does. "allow" (default) | "deny".
  #
  # A namespace nobody has written a policy for is not governed, so there is no customer decision to
  # enforce and the call proceeds. Set "deny" for namespaces you have deliberately locked down —
  # deny-by-default is then an explicit choice rather than the silent consequence of having installed
  # the chart and not configured anything yet.
  #
  # This said `deny`, which silently OVERRODE the code default in norviq/config.py: a fresh install
  # into a namespace with no policy took that namespace's tool calls to zero. Two places holding one
  # concept, and the chart is the one that wins — changing only the Python default did nothing on a
  # real cluster.
  noPolicyDecision: allow
  # OPA evaluation runtime: "server" (HTTP to the sidecar) or "subprocess" (per-call fork, rollback).
  opaMode: server
  # Refuse to start (fail-closed) on a weak/default/short JWT secret or the default admin
  # password. Defaults true — pairs with api.secretKey's auto-generation above, so a stock install is
  # secure without any operator action. Set false only for a throwaway/dev cluster.
  requireStrongSecret: true
  trustThreshold: 0.7
  violationPenalty: 0.05
  rateLimit: 60
  # X-Forwarded-For handling for HTTP rate-limit bucketing. XFF is client-WRITABLE, so trusting its
  # left-most entry lets a caller rotate the header and never fill a bucket (throttle bypass, worst on
  # the pre-auth /auth/login route) — but ignoring it entirely collapses every caller behind a proxy into
  # ONE bucket, so a single abuser throttles everyone. The header is believed only when BOTH the TCP peer
  # is a trusted proxy AND the chain is long enough (see norviq/api/rate_limit.py:_client_ip).
  #
  # The defaults match the SHIPPED topology: config.internalTls puts an nginx in the api pod that sets
  # `X-Forwarded-For $remote_addr` (it REPLACES the header), so the API sees loopback as the peer and
  # exactly one unforgeable entry. A workload that bypasses that proxy and hits the API port directly is
  # not loopback, so its XFF is ignored — it cannot reach the forgeable path at all.
  #   trustedProxyHops:  Nth entry FROM THE RIGHT to use. Raise only if you add more APPENDING proxies
  #                      in front (and widen trustedProxyCidrs to match). 0 = never trust XFF.
  #   trustedProxyCidrs: which PEERS may be believed. Widen only to proxies you actually operate —
  #                      anything in this list can set any client's rate-limit identity.
  httpRateLimitTrustedProxyHops: 1
  httpRateLimitTrustedProxyCidrs: ["127.0.0.0/8", "::1/128"]
  # Per-pod in-process L1 cache (seconds) for the enforcement hot path. OPT-IN: 0 = disabled.
  # Measured on a 2-node AKS cluster: warm read p50 21.9ms -> 3.2ms (-84%), floor 14.5ms -> 1.4ms.
  #
  # WHAT IT CACHES, precisely:
  #   * namespace posture, the stored trust score, and the trust calculator's history/profile reads
  #     — these use this TTL as-is, so this value IS their convergence bound;
  #   * the PRE-OVERRIDE base policy decision — additionally clamped to redis_ttl_eval_s (5s) and
  #     cleared eagerly on any policy change, so it can never be staler than the Redis eval cache.
  # NEVER cached: the admin freeze (agent_frozen) and trust cap (agent_trust_override). Those are read
  # fresh on EVERY call, so an incident-response freeze still takes effect on the very next call
  # regardless of this setting — the kill switch is not on the caching path.
  #
  # WHAT THE TTL COSTS YOU: a posture/threshold change from the console, and any trust-input change,
  # is not observed by an already-warm pod until the entry expires. Enable deliberately.
  # Recommended production value: 5.
  inprocCacheTtlS: 0
  # Hard per-cache entry cap for those L1s (bounds per-pod memory under identity/namespace churn).
  inprocCacheMax: 8192
  # Empty => DERIVED from the datastore you actually chose: `disable` for the bundled Postgres
  # StatefulSet (it has no TLS listener, so `require` could only crash on startup), `require` for
  # CloudNativePG HA and for any external/managed host. Set it explicitly to override — an explicit
  # value always wins, and values-prod.yaml pins `require`. This was a hard `require`, which made a
  # pure-defaults `helm install` unable to start.
  dbSslMode: ""
  dbPoolMaxOverflow: 10
  dbPoolTimeout: 10
  dbCommandTimeout: 10
  # Data retention (keeps the store + UI bounded). NONE of these ever touch an enforcing policy or the
  # current-enforcing version — retention is decoupled from enforcement, and enforcing policies never
  # expire. One hourly background pruner applies every window; 0 (or negative) on any window disables
  # that window (keep forever).
  retention:
    # Audit log — 30d default: the console never displays a window longer than 30d, so anything older
    # serves only external compliance horizons. SOC2/ISO users: raise to 90-365; use the audit-evidence
    # export packs for durable long-term evidence.
    auditRetentionDays: 30
    coverageSnapshotRetentionDays: 30   # compliance trend points + export events (covers the 30d trend view)
    graphSnapshotKeepPerNamespace: 10   # asset-graph snapshots: keep newest N per namespace (readers use only the newest)
    agentRegistryRetentionDays: 90      # remove agent identities unseen for N days (0 = keep forever)
    apiKeyDefaultTtlDays: 90            # NEW API keys default to N-day expiry (per-key override at creation; 0 = never)
    draftTtlDays: 14           # real intent drafts auto-expire after N days
    draftTtlTestHours: 24      # test/e2e (synthetic-class) drafts expire fast
    draftCapPerNamespace: 50   # hard ceiling of real drafts per namespace (evict oldest beyond it)
    draftsPageSize: 15         # bounded drafts endpoint page size (top-N newest + total)
    policyVersionKeepCount: 20 # keep at least the last N versions per policy
    policyVersionKeepDays: 90  # ...and any version within this window; prune older EXCEPT the current
    # Red-team run retention (read-only evidence; the latest run per namespace is never pruned).
    redteamDetailKeepRuns: 1   # keep full per-attack DETAIL for the newest N runs / namespace (last-run-only default; raise for more history)
    redteamDetailKeepDays: 7   # ...or any run within N days; older runs are detail-pruned (summary kept)
    redteamSummaryKeepRuns: 20 # keep SUMMARIES (no detail) for the newest N runs / namespace
    redteamSummaryKeepDays: 30 # ...or any run within N days; older runs are deleted entirely
    redteamHistoryPageSize: 20 # bounded /redteam/results history page size (summaries only)
  # Workload-identity resolution: "mock" (env-var identity; default) or "workload-api" (real SPIFFE
  # SVID, fail-closed). workload-api requires SPIRE on the cluster + pyspiffe installed.
  spiffeMode: mock
  # SPIFFE Workload API socket path (where the SPIFFE CSI driver publishes the agent socket).
  spiffeSocket: /spiffe-workload-api/spire-agent.sock
  # Gate the csi.spiffe.io volume on api/engine pods. OFF by default so deploys WITHOUT SPIRE are
  # unaffected (a csi.spiffe.io volume with no driver/registration wedges pod creation). Turn on
  # ONLY where SPIRE + the SPIFFE CSI driver are installed (e.g. the identity-local kind stack).
  spiffeCsi:
    enabled: false

# OIDC / SSO. Default-off: the API keeps validating legacy HS256 tokens until
# an IdP is wired. Enabling adds RS256/ES256 validation ALONGSIDE HS256 (set legacyHs256Enabled:false
# at cutover). Map IdP groups -> Norviq (role, namespace) via groupMappings (GitOps).
# Local username/password login — the PRIMARY no-IdP path. On a fresh install you sign in with
# adminUsername/adminPassword and are FORCED to change the password on first login. The password is stored
# hashed (bcrypt) in the API's DB; only the seed lives in norviq-secrets. Keep it strong for real installs —
# with config.requireStrongSecret=true the API refuses to start while adminPassword is still the default "norviq".
auth:
  enabled: true            # set false to disable local login (SSO/CLI-only)
  adminUsername: "admin"
  # Leave this at the sentinel default and the chart AUTO-GENERATES a strong random first
  # password (templates/secret.yaml), persisted across `helm upgrade` like api.secretKey. Retrieve it
  # with `kubectl get secret norviq-secrets -o jsonpath='{.data.NRVQ_AUTH_ADMIN_PASSWORD}' | base64 -d`.
  # You are forced to change it on first login either way. Set an explicit value here to pin your own.
  adminPassword: "norviq"
  sessionTtlSeconds: 3600  # short-lived session token
  # Brute-force lockout: after maxAttempts failed logins for a username within windowSeconds, lock out (429).
  loginMaxAttempts: 5
  loginWindowSeconds: 300
  minPasswordLength: 12    # enforced on a NEW password at change-time
  # Identity binding on /evaluate. `agent_class` selects which Rego program is enforced and `spiffe_id`
  # keys the trust score + the agent_frozen: kill-switch, so a credential that CARRIES either claim is
  # ALWAYS pinned to it (never spoofable) regardless of this flag. This governs credentials that carry
  # NO binding — pre-upgrade sidecar tokens and API keys issued without an agentClass:
  #   false (default) — they may still assert an identity, so an upgrade doesn't fail-closed every
  #                     in-flight sidecar mid-rollout.
  #   true            — every non-admin caller must present a bound credential (403 otherwise).
  # DEFAULTS TO true (F-003): agent_class selects the Rego program, so it must be attested like
  # namespace already is. Left false, a namespace-scoped key with an empty agent_class let the request
  # BODY pick the class — including one with no policy, which falls through to noPolicyDecision: allow.
  # Set false only for an in-flight upgrade from 0.1.x whose sidecars/API keys predate agent_class
  # binding; re-admit the sidecars (the webhook stamps agent_class from the pod's norviq.io/agent-class
  # label), re-issue workload keys with an agent_class, then set it back to true.
  requireBoundAgentIdentity: true

oidc:
  enabled: false
  issuer: ""              # https://<tenant>/  (the token `iss`)
  audience: ""            # the API's client/audience id (the token `aud`)
  # The PUBLIC (browser/SPA) OIDC client id the console uses for Auth Code + PKCE sign-in.
  # Register a SPA/public client in your IdP with redirect URI <console>/auth/callback. When set (and
  # oidc.enabled), the UI renders "Sign in with SSO" — no UI rebuild needed (injected at runtime).
  consoleClientId: ""
  providerName: ""        # Human-readable IdP name shown in login copy (e.g. "Okta"); optional
  jwksUrl: ""             # the IdP JWKS endpoint
  groupClaim: groups      # claim holding the user's group list
  legacyHs256Enabled: true
  groupMappings: {}       # e.g. {"norviq-admins":{"role":"admin"},"team-a":{"role":"viewer","namespace":"team-a"}}

rbac:
  # The chart ships the norviq-admin / norviq-policy-editor / norviq-viewer ClusterRoles but no
  # subject bindings. Map them to your IdP groups or ServiceAccounts here. Gated off by default —
  # set enabled: true and fill `bindings`. See docs/engineering/production-config.md.
  exampleBindings:
    enabled: false
  bindings: []
    # - role: norviq-admin          # one of: norviq-admin | norviq-policy-editor | norviq-viewer
    #   kind: Group                 # Group | User | ServiceAccount
    #   name: norviq-platform-admins
    # - role: norviq-viewer
    #   kind: Group
    #   name: norviq-readonly
    # - role: norviq-policy-editor
    #   kind: ServiceAccount
    #   name: ci-policy-bot
